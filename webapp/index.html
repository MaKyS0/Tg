<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Coin Clicker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffd23f' stroke='%23d99000' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23d99000' stroke-width='2.5'/%3E%3C/svg%3E">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&family=Unbounded:wght@700;800&display=swap">
  <style>
    :root {
      /* Layout: phone = header (league, world, gems) / score / coin / bottom nav, shop screens slide in above the nav.
         Desktop = stage on the left, nav + shop as a sidebar on the right.
         Surfaces are tints of the Telegram text colour, so light and dark themes both work. */
      --bg: var(--tg-theme-bg-color, #101a20);
      --text: var(--tg-theme-text-color, #f2f7f6);
      --hint: var(--tg-theme-hint-color, #8aa0a8);
      --card: rgba(255, 255, 255, .07);
      --card-2: rgba(255, 255, 255, .13);
      --line: rgba(255, 255, 255, .14);
      --sheet: var(--bg);
      --accent: #ffc83d;
      --accent-ink: #ffd96e;
      --good: #3ddc97;
      --bad: #ff6b81;
      --side: clamp(380px, 38vw, 520px);
      --nav-h: 66px;
      --font-display: "Unbounded", "Arial Black", "Segoe UI", system-ui, sans-serif;
      --font-body: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @supports (color: color-mix(in srgb, red, blue)) {
      :root {
        --card: color-mix(in srgb, var(--text) 7%, transparent);
        --card-2: color-mix(in srgb, var(--text) 13%, transparent);
        --line: color-mix(in srgb, var(--text) 14%, transparent);
        --sheet: color-mix(in srgb, var(--bg) 86%, transparent);
        --accent-ink: color-mix(in srgb, var(--accent) 55%, var(--text));
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: var(--font-body);
      user-select: none; -webkit-user-select: none; overflow: hidden;
    }
    button { font-family: inherit; }
    main {
      position: relative; z-index: 1;
      height: 100%;
      display: flex; flex-direction: column; align-items: center;
    }
    main > * { width: 100%; max-width: 640px; }
    #sky { position: fixed; inset: 0; pointer-events: none; }
    .world-enter { animation: world-in .6s ease-out; }
    @keyframes world-in { from { opacity: 0; } to { opacity: 1; } }

    /* header: league progress, current world, gems */
    .hud { display: flex; align-items: center; gap: 8px; padding: 10px 12px 0; }
    .league {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px;
      padding: 5px 12px 5px 5px; border-radius: 16px; background: var(--card); border: 1px solid var(--line);
    }
    .emblem {
      position: relative; flex: none; width: 36px; height: 36px; border-radius: 12px; color: #fff;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--c1, #b4bec4), var(--c2, #6b7782));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -3px 6px rgba(0,0,0,.2), 0 3px 8px rgba(0,0,0,.25);
    }
    .emblem svg { position: absolute; width: 28px; height: 28px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.3)); }
    .emblem b { position: relative; font-family: var(--font-display); font-size: 11px; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
    .lg-info { flex: 1; min-width: 0; }
    .lg-name { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 800; }
    .lg-name span { color: var(--hint); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .meter { display: block; height: 6px; margin-top: 5px; border-radius: 3px; background: var(--card-2); overflow: hidden; }
    .meter b { display: block; width: 0; height: 100%; border-radius: 3px; transition: width .3s; background: linear-gradient(90deg, var(--c1, var(--accent)), var(--c2, #ff9d2e)); }
    .world-pill {
      display: inline-flex; align-items: center; gap: 6px; flex: none;
      padding: 4px 11px 4px 4px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--card); color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .world-pill .dot { width: 26px; height: 26px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; }
    .world-pill .dot svg { width: 15px; height: 15px; }
    .world-pill b { font-family: var(--font-display); font-size: 12px; color: var(--accent-ink); }
    #world-name { display: none; }
    .gems-chip { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 9px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }

    /* score */
    .score-box { text-align: center; padding: 8px 16px 0; }
    .score-line { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .score-line > svg { width: clamp(26px, 8vw, 38px); height: clamp(26px, 8vw, 38px); flex: none; filter: drop-shadow(0 2px 6px rgba(255, 190, 0, .5)); }
    #score {
      font-family: var(--font-display); font-weight: 800; line-height: 1.15;
      font-size: clamp(28px, 10vw, 44px); font-variant-numeric: tabular-nums;
    }
    #score[data-long] { font-size: clamp(22px, 7.4vw, 32px); }
    .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 6px; }
    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px 4px 8px; border-radius: 999px; background: var(--card);
      color: var(--hint); font-size: 12px; font-weight: 500;
    }
    .chip b { color: var(--text); font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .chip svg { width: 14px; height: 14px; }
    .chip b.pos::before { content: "+"; }
    .buff { background: rgba(255, 200, 61, .16); box-shadow: inset 0 0 0 1px rgba(255, 200, 61, .5); color: var(--accent-ink); }
    .buff[hidden] { display: none; }
    .buff svg { color: var(--accent); }
    .buff b { color: var(--accent-ink); }

    /* stage */
    .coin-wrap { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; max-width: none; }
    .coin-holder { position: relative; z-index: 1; text-align: center; padding-top: 8px; }
    .coin-stage { position: relative; display: inline-block; --glow: 255, 190, 0; }
    .halo {
      position: absolute; inset: -26%; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(var(--glow), .34) 0%, transparent 62%);
      animation: breathe 3.2s ease-in-out infinite;
    }
    .ring {
      position: absolute; inset: -6%; border-radius: 50%; pointer-events: none;
      border: 2px dashed rgba(var(--glow), .5); animation: spin 50s linear infinite;
    }
    @keyframes breathe { 0%, 100% { transform: scale(.94); opacity: .75; } 50% { transform: scale(1.04); opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    #scene {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: min(100%, 640px); height: 42%; pointer-events: none;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
    }
    #scene svg { display: block; width: 100%; height: 100%; }
    #coin {
      position: relative;
      width: min(62vw, 38vh, 300px); aspect-ratio: 1; border: none; border-radius: 50%; padding: 0;
      cursor: pointer; touch-action: manipulation;
      transition: transform .12s ease-out;
      font-family: var(--font-display);
      font-size: min(26vw, 16vh, 130px); font-weight: 800;
    }
    #coin.pressed { transform: scale(.92); }
    #coin.holo { animation: holo 6s linear infinite; }
    @keyframes holo { to { filter: hue-rotate(360deg); } }
    .kbd-hint { display: none; color: var(--hint); font-size: 12px; margin-top: 10px; }

    /* world particles: each <i> gets --s (size), --d (duration), --dl (negative delay) inline */
    #fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    #fx i { position: absolute; width: var(--s); height: var(--s); border-radius: 50%; }
    .fx-firefly i { background: #d9f99d; box-shadow: 0 0 8px #84cc16; animation: hover var(--d) ease-in-out var(--dl) infinite; }
    .fx-sand i { background: #f5c451; animation: blow var(--d) linear var(--dl) infinite, sway 1.6s ease-in-out infinite alternate; }
    .fx-snow i { background: #e0f2fe; box-shadow: 0 0 4px #38bdf8; animation: fall var(--d) linear var(--dl) infinite, sway 2.4s ease-in-out infinite alternate; }
    .fx-ember i { background: #ffb347; box-shadow: 0 0 6px #ff5a00; animation: rise var(--d) ease-in var(--dl) infinite, sway 1.2s ease-in-out infinite alternate; }
    .fx-bubble i { border: 1.5px solid rgba(34, 211, 238, .8); animation: rise var(--d) linear var(--dl) infinite, sway 2s ease-in-out infinite alternate; }
    .fx-star i { background: #ddd6fe; box-shadow: 0 0 6px #a78bfa; animation: twinkle var(--d) ease-in-out var(--dl) infinite; }
    @keyframes fall { from { top: -4%; } to { top: 104%; } }
    @keyframes rise { from { top: 104%; opacity: 1; } to { top: -4%; opacity: 0; } }
    @keyframes blow { from { left: -4%; } to { left: 104%; } }
    @keyframes sway { from { transform: translateX(-6px); } to { transform: translateX(6px); } }
    @keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.5); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes hover { 0%, 100% { opacity: .2; transform: translate(0, 0); } 50% { opacity: 1; transform: translate(14px, -20px); } }

    /* floating numbers, sparks, golden coin, toast */
    .plus {
      position: fixed; z-index: 10; pointer-events: none;
      font-family: var(--font-display); font-size: 22px; font-weight: 800; color: var(--accent);
      text-shadow: 0 2px 6px rgba(0,0,0,.5);
      animation: float .8s ease-out forwards;
    }
    .plus.crit { font-size: 30px; color: #ff6aa8; }
    @keyframes float {
      from { opacity: 1; transform: translate(-50%, -50%); }
      to   { opacity: 0; transform: translate(-50%, -150px); }
    }
    .spark { position: fixed; z-index: 8; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; box-shadow: 0 0 8px currentColor; }
    .golden {
      position: fixed; z-index: 9; left: -64px; top: var(--y); width: 54px; height: 54px; padding: 0; border: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation;
      background: radial-gradient(circle at 35% 30%, #fff6a8, #ffd23f 35%, #f0a500 75%, #b8740a);
      box-shadow: inset 0 0 0 4px #d99000, 0 0 22px 6px rgba(255, 200, 0, .6);
      animation: cross 9s linear forwards, bob 1s ease-in-out infinite alternate;
    }
    .golden::after { content: "$"; font-family: var(--font-display); font-weight: 800; font-size: 24px; color: #b06a00; }
    @keyframes cross { to { left: 100vw; } }
    @keyframes bob { from { transform: translateY(-14px) rotate(-8deg); } to { transform: translateY(14px) rotate(8deg); } }
    #toast {
      position: fixed; z-index: 20; left: 50%; bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom)); max-width: 90%; text-align: center;
      padding: 9px 15px; border-radius: 14px; background: var(--text); color: var(--bg);
      font-size: 13px; font-weight: 700; pointer-events: none;
      opacity: 0; transform: translate(-50%, 8px); transition: opacity .2s, transform .2s;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (prefers-reduced-motion: reduce) {
      #fx { display: none; }
      .halo, .ring, #coin.holo { animation: none; }
      .golden { animation: cross 14s linear forwards; }
    }

    /* shop screen (phone: replaces the coin while a section is open) */
    .panel {
      display: none; flex: 1; min-height: 0; flex-direction: column; gap: 10px;
      margin-top: 10px; padding: 14px 12px 8px;
      background: var(--sheet); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      border-top: 1px solid var(--line); border-radius: 22px 22px 0 0;
    }
    main.open .panel { display: flex; }
    main.open .coin-wrap { display: none; }
    .sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 4px; }
    #sheet-title { margin: 0; font-family: var(--font-display); font-size: 18px; font-weight: 800; }
    #sheet-sub { color: var(--hint); font-size: 12px; font-weight: 500; text-align: right; }
    .list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--card-2) transparent; }

    /* bottom navigation */
    .tabs {
      flex: none; display: flex; gap: 2px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      background: var(--sheet); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      border-top: 1px solid var(--line);
    }
    .tab {
      position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 8px 0 7px; border: none; border-radius: 14px; background: transparent; color: var(--hint);
      font-size: clamp(9.5px, 2.9vw, 11px); font-weight: 700; cursor: pointer;
      transition: color .15s, background .15s;
    }
    .tab svg { width: 22px; height: 22px; display: block; }
    .tl { max-width: 100%; overflow: hidden; white-space: nowrap; }
    .tab.active { color: var(--text); background: var(--card-2); }
    .tab.active svg { color: var(--accent-ink); filter: drop-shadow(0 0 6px rgba(255, 200, 61, .55)); }
    .badge { display: none; position: absolute; top: 5px; left: calc(50% + 7px); width: 9px; height: 9px; border-radius: 50%; background: #ff4f6d; box-shadow: 0 0 0 2px var(--bg); }
    .tab.has-badge:not(.active) .badge { display: block; }

    /* list rows */
    .item {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 10px 12px; border: 1px solid transparent; border-radius: 16px; text-align: left;
      background: var(--card); color: var(--text); font: inherit; cursor: pointer;
      transition: transform .1s ease-out;
    }
    .item:disabled, .tile:disabled { opacity: .5; cursor: default; }
    .item.equipped, .item.maxed, .tile.equipped { opacity: 1; }
    .item.equipped, .tile.equipped { border-color: var(--accent); background: rgba(255, 200, 61, .1); }
    .icon {
      width: 42px; height: 42px; border-radius: 13px; flex: none; color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -3px 6px rgba(0,0,0,.18), 0 3px 8px rgba(0,0,0,.25);
    }
    .icon svg { width: 24px; height: 24px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.3)); }
    .cur { width: 15px; height: 15px; vertical-align: -2px; flex: none; }
    .info { flex: 1; min-width: 0; }
    .name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .lv { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--card-2); color: var(--hint); }
    .desc { color: var(--hint); font-size: 13px; margin-top: 1px; }
    .price {
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
      padding: 6px 11px; border-radius: 999px; font-weight: 800; font-size: 14px;
      color: var(--accent-ink); background: rgba(255, 200, 61, .16); box-shadow: inset 0 0 0 1px rgba(255, 200, 61, .5);
    }
    .item:disabled .price, .tile:disabled .price { background: var(--card-2); box-shadow: none; color: var(--hint); }
    .item:not(:disabled) .price.free, .tile:not(:disabled) .price.free { background: var(--card-2); box-shadow: none; color: var(--text); }
    .item.equipped .price, .tile.equipped .price { color: var(--accent-ink); }
    .section { color: var(--hint); font-size: 13px; font-weight: 700; padding: 8px 4px 0; display: flex; align-items: center; gap: 7px; }
    .section .rar { width: 8px; height: 8px; border-radius: 50%; background: var(--rar); box-shadow: 0 0 8px var(--rar); }
    .more { color: var(--hint); font-size: 12px; text-align: center; padding: 6px 12px 2px; }
    .bar { display: block; height: 5px; margin: 6px 0 2px; border-radius: 3px; background: var(--card-2); overflow: hidden; }
    .bar b { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), #ff9d2e); }
    .pg { font-size: 11px; }

    /* skin tiles */
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .tile {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 12px 6px 8px; border: 1px solid transparent; border-radius: 16px;
      background: var(--card); color: var(--text); font: inherit; cursor: pointer; text-align: center;
      transition: transform .1s ease-out;
    }
    .tile::after { content: ""; position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--rar); box-shadow: 0 0 7px var(--rar); }
    .skin-icon {
      width: 50px; height: 50px; border-radius: 50%; flex: none; margin-bottom: 3px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-weight: 800; font-size: 22px;
    }
    .t-name { font-weight: 700; font-size: 13px; }
    .t-bonus { color: var(--hint); font-size: 11px; margin-bottom: 4px; }
    .tile .price { font-size: 12px; padding: 3px 9px; }

    /* prestige */
    .pcard {
      display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(124, 92, 255, .22), rgba(255, 79, 154, .16));
    }
    .p-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
    .p-gain { display: flex; flex-direction: column; gap: 2px; }
    .p-label { color: var(--hint); font-size: 12px; }
    .p-gain b { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: 28px; line-height: 1.1; }
    .p-gain .cur { width: 22px; height: 22px; }
    .p-stat { color: var(--hint); font-size: 12px; text-align: right; line-height: 1.5; }
    .p-stat b { color: var(--text); font-weight: 800; }
    .keep-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--hint); }
    .pill { padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--text); background: var(--card); }
    .pill.keep { box-shadow: inset 0 0 0 1px var(--good); }
    .pill.lose { box-shadow: inset 0 0 0 1px var(--bad); }
    .rebirth-btn {
      border: none; border-radius: 14px; padding: 13px; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer;
      color: #fff; background: linear-gradient(135deg, #7c5cff, #ff4f9a);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 14px rgba(255, 79, 154, .35);
    }
    .rebirth-btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
    .rebirth-btn.armed { background: linear-gradient(135deg, #ef4444, #f97316); }

    /* keyboard focus */
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tab:focus-visible { outline-offset: -2px; }

    /* mouse: hover feedback */
    @media (hover: hover) {
      .kbd-hint { display: block; }
      .item:not(:disabled):hover, .tile:not(:disabled):hover { background: var(--card-2); transform: translateY(-1px); }
      .item:not(:disabled):active, .tile:not(:disabled):active { transform: scale(.975); }
      .tab:not(.active):hover { color: var(--text); background: var(--card); }
      .world-pill:hover { background: var(--card-2); }
      #coin:hover { transform: scale(1.03); }
      #coin.pressed, #coin.pressed:hover { transform: scale(.92); }
    }

    /* desktop and landscape: stage on the left, nav + shop as a sidebar on the right */
    @media (min-width: 760px) and (min-aspect-ratio: 1/1) {
      main {
        display: grid; grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: auto auto minmax(0, 1fr);
        grid-template-areas: "hud nav" "score panel" "stage panel";
        align-items: stretch; justify-items: stretch;
      }
      main > * { max-width: none; }
      .hud { grid-area: hud; justify-content: center; padding: 16px 20px 0; }
      .league { flex: 0 1 340px; }
      #world-name { display: inline; }
      .score-box { grid-area: score; padding-top: 12px; }
      #score { font-size: clamp(36px, 7.5vh, 68px); }
      #score[data-long] { font-size: clamp(28px, 5.6vh, 50px); }
      .score-line > svg { width: clamp(34px, 6vh, 52px); height: clamp(34px, 6vh, 52px); }
      .stats { gap: 8px; margin-top: 10px; }
      .chip { font-size: 13px; padding: 5px 12px 5px 10px; }
      .chip b { font-size: 14px; }
      .chip svg { width: 16px; height: 16px; }
      .coin-wrap { grid-area: stage; }
      main.open .coin-wrap { display: flex; }
      #scene { width: min(100%, 980px); height: 38%; }
      #coin { width: min(34vw, 40vh, 400px); font-size: min(14vw, 17vh, 170px); }
      .kbd-hint { font-size: 13px; margin-top: 16px; }
      .plus { font-size: 28px; }
      .plus.crit { font-size: 38px; }
      .tabs {
        grid-area: nav; align-items: stretch; padding: 10px 14px;
        border-top: none; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line);
      }
      .tab { font-size: 12px; padding: 9px 0 8px; }
      .tab[data-tab="home"] { display: none; }
      .badge { left: calc(50% + 9px); }
      .panel, main.open .panel {
        grid-area: panel; display: flex; margin-top: 0; padding: 16px;
        border-top: none; border-left: 1px solid var(--line); border-radius: 0;
      }
      #sheet-title { font-size: 20px; }
      .list { gap: 10px; padding-right: 2px; }
      .item { padding: 12px 14px; }
      .name { font-size: 16px; }
      .desc { font-size: 14px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
      .tile { padding: 14px 6px 10px; }
      #toast { left: calc((100vw - var(--side)) / 2); bottom: 28px; }
    }
  </style>
</head>
<body>
  <div id="sky"></div>
  <div id="toast" role="status"></div>
  <main id="main">
    <header class="hud">
      <div class="league" id="league">
        <span class="emblem" id="emblem"></span>
        <div class="lg-info">
          <div class="lg-name"><span id="lg-name" style="color:var(--text);font-size:13px;font-weight:800"></span><span id="lg-pct"></span></div>
          <i class="meter"><b id="lg-bar"></b></i>
        </div>
      </div>
      <button class="world-pill" id="world-pill" aria-label="Миры">
        <span class="dot" id="world-dot"></span><span id="world-name"></span><b id="world-mult"></b>
      </button>
      <span class="gems-chip"><span id="gem-icon"></span><b id="gems">0</b></span>
    </header>
    <div class="score-box">
      <div class="score-line"><span id="score-ic"></span><div id="score">0</div></div>
      <div class="stats">
        <span class="chip"><span id="ic-click"></span><b id="per-click" class="pos">1</b> за клик</span>
        <span class="chip"><span id="ic-sec"></span><b id="per-sec" class="pos">0</b> в секунду</span>
        <span class="chip buff" id="buff" hidden></span>
      </div>
    </div>
    <div class="coin-wrap">
      <div id="scene"></div>
      <div id="fx"></div>
      <div class="coin-holder">
        <div class="coin-stage" id="stage">
          <div class="halo"></div><div class="ring"></div>
          <button id="coin" aria-label="Кликнуть по монетке"></button>
        </div>
        <div class="kbd-hint">Пробел — клик · цифры — разделы</div>
      </div>
    </div>
    <section class="panel">
      <div class="sheet-head"><h2 id="sheet-title"></h2><span id="sheet-sub"></span></div>
      <div class="list" id="list"></div>
    </section>
    <nav class="tabs" aria-label="Разделы">
      <button class="tab active" data-tab="home" aria-label="Монета"><span class="ti"></span><span class="tl">Тап</span></button>
      <button class="tab" data-tab="upgrades" aria-label="Прокачка"><span class="ti"></span><span class="tl">Прокачка</span></button>
      <button class="tab" data-tab="skins" aria-label="Скины"><span class="ti"></span><span class="tl">Скины</span></button>
      <button class="tab" data-tab="worlds" aria-label="Миры"><span class="ti"></span><span class="tl">Миры</span></button>
      <button class="tab" data-tab="rebirth" aria-label="Перерождение"><span class="ti"></span><span class="tl">Престиж</span></button>
      <button class="tab" data-tab="rewards" aria-label="Награды"><span class="ti"></span><span class="tl">Награды</span><i class="badge"></i></button>
    </nav>
  </main>

    const CRIT_CHANCE = 0.08, CRIT_MULT = 5;

    // Achievements pay gems once. val() reads lifetime counters, so rebirths never lose progress.
    const ACH_GRAD = {

      skin: ["#f78fc0", "#db2777"], space: ["#3ddbe6", "#3b82f6"], mult: ["#ffe27a", "#f0a500"],
    };
    const ACHS = [
      ["clicks100", "power", "Разминка", "Сделай 100 кликов", 100, 1, () => state.clicks],
      ["clicks1k", "power", "Мозоли", "Сделай 1 000 кликов", 1e3, 2, () => state.clicks],
      ["clicks10k", "power", "Железные пальцы", "Сделай 10 000 кликов", 1e4, 5, () => state.clicks],
      ["coins10k", "gold", "Копилка", "Заработай 10 000 монет за всё время", 1e4, 1, () => state.total],
      ["coins1m", "gold", "Миллионер", "Заработай 1 млн монет за всё время", 1e6, 3, () => state.total],
      ["coins1b", "gold", "Магнат", "Заработай 1 млрд монет за всё время", 1e9, 8, () => state.total],
      ["coins1t", "gold", "Монетный дракон", "Заработай 1 трлн монет за всё время", 1e12, 20, () => state.total],
      ["league3", "gold", "Золотая лига", "Достигни лиги «Золото»", 3, 5, () => leagueInfo().i],
      ["league6", "gold", "Живая легенда", "Достигни лиги «Легенда»", 6, 15, () => leagueInfo().i],
      ["rb1", "cycle", "Второй шанс", "Переродись 1 раз", 1, 2, () => state.rebirths],
      ["rb5", "cycle", "Колесо сансары", "Переродись 5 раз", 5, 5, () => state.rebirths],
      ["rb15", "cycle", "Бессмертный", "Переродись 15 раз", 15, 12, () => state.rebirths],
      ["skins5", "skin", "Модник", "Собери 5 скинов", 5, 3, () => state.owned.length],
      ["skins10", "skin", "Коллекционер", "Собери 10 скинов", 10, 6, () => state.owned.length],
      ["skinsAll", "skin", "Музей монет", "Собери все скины", SKINS.length, 15, () => state.owned.length],
      ["worlds3", "space", "Путешественник", "Открой 3 мира", 3, 3, () => state.worlds.length],
      ["worldsAll", "space", "Покоритель миров", "Открой все миры", WORLDS.length, 10, () => state.worlds.length],
      ["gold1", "mult", "Золотая удача", "Поймай золотую монету", 1, 1, () => state.golden],
      ["gold10", "mult", "Охотник за золотом", "Поймай 10 золотых монет", 10, 4, () => state.golden],
    ].map(([id, icon, name, desc, target, gems, val]) => ({ id, icon, name, desc, target, gems, val, grad: ACH_GRAD[icon] }));

    const mainEl = document.getElementById("main");
    const scoreEl = document.getElementById("score");
    const perClickEl = document.getElementById("per-click");
    const perSecEl = document.getElementById("per-sec");
    const gemsEl = document.getElementById("gems");
    document.getElementById("gem-icon").innerHTML = GEM;
    document.getElementById("score-ic").innerHTML = COIN;
    document.getElementById("ic-click").innerHTML = ICONS.power;
    document.getElementById("ic-sec").innerHTML = ICONS.auto;
    const stageEl = document.getElementById("stage");
    const buffEl = document.getElementById("buff");
    const toastEl = document.getElementById("toast");
    const emblemEl = document.getElementById("emblem");
    const leagueEl = document.getElementById("league");
    const TAB_ICONS = { home: "tap", upgrades: "up", skins: "skin", worlds: "space", rebirth: "cycle", rewards: "trophy" };
    const TAB_TITLES = { upgrades: "Прокачка", skins: "Скины", worlds: "Миры", rebirth: "Перерождение", rewards: "Награды" };
    const coin = document.getElementById("coin");
    const listEl = document.getElementById("list");
    const tabs = document.querySelectorAll(".tab");
    const skyEl = document.getElementById("sky");
    const sceneEl = document.getElementById("scene");
    const fxEl = document.getElementById("fx");
    const wide = window.matchMedia("(min-width: 760px) and (min-aspect-ratio: 1/1)");
    const calm = window.matchMedia("(prefers-reduced-motion: reduce)");
    tabs.forEach((t) => {
      t.querySelector(".ti").innerHTML = ICONS[TAB_ICONS[t.dataset.tab]];
      t.title = t.getAttribute("aria-label");
    });

    const defaultState = () => ({
      score: 0,
      lv: Object.fromEntries(UPGRADES.map((u) => [u.id, 0])),
      gems: 0,
      rebirths: 0,
      earned: 0,
      perm: Object.fromEntries(PERMS.map((u) => [u.id, 0])),
      owned: ["classic"],
      skin: "classic",
      worlds: ["meadow"],
      world: "meadow",
      clicks: 0,
      total: 0,
      golden: 0,
      claimed: [],
      lastSeen: 0,
      daily: { last: "", streak: 0 },
    });
    let state = defaultState();
    let tab = "home";
    let ready = false;
    let saveTimer = null;
    let rebirthArmed = false;
    let armTimer = null;
    let buff = { until: 0, mult: 1 }; // temporary click multiplier from golden coins; not saved
    let goldenEl = null;
    let nextGolden = Date.now() + 40000 + Math.random() * 40000;
    let toastTimer = null;
    let rewardSig = "";
    let shownLeague = -1;

    const compact = new Intl.NumberFormat("ru-RU", { notation: "compact", maximumFractionDigits: 2 });
    const fmt = (n) => (n >= 1e9 ? compact.format(Math.floor(n)) : Math.floor(n).toLocaleString("ru-RU"));
    const skinById = (id) => SKINS.find((s) => s.id === id) || SKINS[0];
    const worldById = (id) => WORLDS.find((w) => w.id === id) || WORLDS[0];
    const isMax = (u) => u.max && state.lv[u.id] >= u.max;
    const upgradeCost = (u) =>
      Math.max(1, Math.floor(u.base * Math.pow(u.growth, state.lv[u.id]) * (1 - 0.05 * state.perm.discount)));
    const permCost = (u) => Math.floor(u.base * Math.pow(u.growth, state.perm[u.id]));
    const multiplier = () =>
      (1 + 0.25 * state.lv.mult) * (1 + 0.5 * state.perm.gold) * worldById(state.world).mult;
    const gemBoost = () => 1 + 0.25 * state.perm.gain;
    const rebirthGain = () => Math.floor(Math.sqrt(state.earned / REBIRTH_DIVISOR) * gemBoost());
    const earnedForGems = (g) => REBIRTH_DIVISOR * Math.pow(g / gemBoost(), 2); // coins needed in a run to reach g gems
    const keepShare = () => Math.min(0.6, 0.1 + 0.05 * state.perm.heritage);    // share of upgrade levels kept by a rebirth
    const startCoins = () => 200 * state.perm.start;
    function addCoins(n) { state.score += n; state.earned += n; state.total += n; }
    const buffActive = () => Date.now() < buff.until;
    const baseIncome = () => GENS.reduce((sum, u) => sum + u.inc * state.lv[u.id], 0);
    const perSec = () => Math.round(baseIncome() * multiplier());
    const perClick = () =>
      Math.round((1 + state.lv.power + skinById(state.skin).bonus + state.lv.fingers * 0.01 * baseIncome()) *
        multiplier() * (1 + 0.25 * state.perm.cpower) * (buffActive() ? buff.mult : 1));
    const critChance = () => CRIT_CHANCE + 0.01 * state.lv.crit;
    const critMult = () => CRIT_MULT + 0.5 * state.lv.critp;
    const goldenGap = () => (45000 + Math.random() * 75000) * (1 - 0.06 * state.lv.luck);
    const feverMs = () => 15000 + 3000 * state.lv.fever;
    const offlineRate = () => 0.5 + 0.1 * state.perm.night;
    const offlineCap = () => (3 + state.perm.night) * 3600;

    function leagueInfo() {
      let i = 0;
      while (i < LEAGUES.length - 1 && state.total >= LEAGUES[i + 1].at) i++;
      const cur = LEAGUES[i], next = LEAGUES[i + 1];
      return { i, cur, next, pct: next ? (state.total - cur.at) / (next.at - cur.at) : 1 };
    }

    // Telegram CloudStorage keeps progress per user across devices;
    // localStorage is the fallback when opened outside Telegram.
    const cloud = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")
      ? tg.CloudStorage : null;

    function readKey(key) {
      return new Promise((resolve) => {
        if (cloud) {
          cloud.getItem(key, (err, value) => resolve(err ? "" : value || ""));
        } else {
          try { resolve(localStorage.getItem(key) || ""); } catch { resolve(""); }
        }
      });
    }

    async function load() {
      const next = defaultState();
      const raw = await readKey(STORAGE_KEY);
      if (raw) {
        try {
          const s = JSON.parse(raw);
          const whole = (v) => Math.max(0, Math.floor(Number(v) || 0));
          next.score = Number(s.score) || 0;
          next.gems = whole(s.gems);
          next.rebirths = whole(s.rebirths);
          next.earned = Math.max(Number(s.earned) || 0, next.score);
          for (const u of UPGRADES) next.lv[u.id] = Math.min(u.max || Infinity, whole(s.lv && s.lv[u.id]));
          for (const u of PERMS) next.perm[u.id] = Math.min(u.max || Infinity, whole(s.perm && s.perm[u.id]));
          const owned = Array.isArray(s.owned) ? s.owned.filter((id) => SKINS.some((x) => x.id === id)) : [];
          next.owned = Array.from(new Set(["classic", ...owned]));
          next.skin = next.owned.includes(s.skin) ? s.skin : "classic";
          const worlds = Array.isArray(s.worlds) ? s.worlds.filter((id) => WORLDS.some((x) => x.id === id)) : [];
          next.worlds = Array.from(new Set(["meadow", ...worlds]));
          next.world = next.worlds.includes(s.world) ? s.world : "meadow";
          next.clicks = whole(s.clicks);
          next.golden = whole(s.golden);
          next.total = Math.max(Number(s.total) || 0, next.earned);
          next.claimed = Array.isArray(s.claimed) ? s.claimed.filter((id) => ACHS.some((a) => a.id === id)) : [];
          next.lastSeen = Number(s.lastSeen) || 0;
          const d = s.daily || {};
          next.daily = { last: typeof d.last === "string" ? d.last : "", streak: whole(d.streak) };
        } catch {}
      } else {
        // progress from the first version (score only)
        next.score = Number(await readKey(LEGACY_KEY)) || 0;
        next.earned = next.score;
        next.total = next.score;
      }
      return next;
    }

    function writeNow() {
      state.lastSeen = Date.now();
      const json = JSON.stringify(state);
      if (cloud) cloud.setItem(STORAGE_KEY, json);
      else try { localStorage.setItem(STORAGE_KEY, json); } catch {}
    }

    function save() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(writeNow, 300);
    }

    function flush() {
      if (!ready) return;
      clearTimeout(saveTimer);
      writeNow();
    }

    function applySkin() {
      const s = skinById(state.skin);
      coin.textContent = s.glyph;
      coin.style.background = `radial-gradient(circle at 35% 30%, ${s.c[0]} 0%, ${s.c[1]} 30%, ${s.c[2]} 70%, ${s.c[3]} 100%)`;
      coin.style.boxShadow = `0 0 0 10px ${s.rim} inset, 0 0 0 14px ${s.rim2} inset, 0 12px 40px rgba(${s.glow}, .35)`;
      coin.style.color = s.ink;
      coin.style.textShadow = `0 2px 0 ${s.hi}`;
      stageEl.style.setProperty("--glow", s.glow);
      coin.classList.toggle("holo", s.fx === "holo");
    }

    const worldGrad = (w) => `linear-gradient(135deg, ${w.grad[0]}, ${w.grad[1]})`;

    function applyWorld() {
      const w = worldById(state.world);
      skyEl.style.background =
        `radial-gradient(130% 60% at 50% 0%, rgba(${w.sky}, .3), transparent 70%), ` +
        `linear-gradient(to top, rgba(${w.sky}, .12), transparent 60%)`;
      sceneEl.innerHTML = `<svg viewBox="0 0 400 120" preserveAspectRatio="none">
        ${w.extra || ""}
        <path d="${w.back}" fill="${w.ground}" opacity=".35"/>
        <path d="${w.front}" fill="${w.ground}" opacity=".65"/></svg>`;
      let dots = "";
      for (let i = 0; i < 18; i++) {
        const d = FX_SPEED[w.fx] * (1 + Math.random());
        dots += `<i style="left:${(Math.random() * 100).toFixed(1)}%; top:${(Math.random() * 100).toFixed(1)}%; ` +
                `--s:${(2 + Math.random() * 4).toFixed(1)}px; --d:${d.toFixed(2)}s; --dl:-${(Math.random() * d).toFixed(2)}s"></i>`;
      }
      fxEl.className = "fx-" + w.fx;
      fxEl.innerHTML = dots;
      document.getElementById("world-dot").style.background = worldGrad(w);
      document.getElementById("world-dot").innerHTML = ICONS[w.id];
      document.getElementById("world-name").textContent = w.name;
      document.getElementById("world-mult").textContent = `×${w.mult}`;
      [skyEl, sceneEl, fxEl].forEach((el) => {
        el.classList.remove("world-enter");
        void el.offsetWidth; // restart the fade-in
        el.classList.add("world-enter");
      });
    }

    function skinIconStyle(s) {
      return `background: radial-gradient(circle at 35% 30%, ${s.c[0]}, ${s.c[1]} 35%, ${s.c[2]} 75%, ${s.c[3]}); ` +
             `box-shadow: 0 0 0 3px ${s.rim} inset; color: ${s.ink};`;
    }

    function itemHTML({ act, name, desc, price, cost, cur, disabled, cls, lead, cta }) {
      return `
        <button class="item${cls ? " " + cls : ""}" data-act="${act}"
                ${cost != null ? `data-cost="${cost}" data-cur="${cur}"` : ""} ${disabled ? "disabled" : ""}>
          ${lead}
          <span class="info">
            <div class="name">${name}</div>
            <div class="desc">${desc}</div>
          </span>
          <span class="price${cost == null && !cta ? " free" : ""}">${price}</span>
        </button>`;
    }

    const iconTile = (id, grad) =>
      `<span class="icon" style="background: linear-gradient(135deg, ${grad[0]}, ${grad[1]})">${ICONS[id]}</span>`;
    const LOCK = ICONS.lock.replace("<svg", '<svg class="cur"');

    function worldItem(w, i) {
      const prev = WORLDS[i - 1];
      const item = { act: `world:${w.id}`, lead: iconTile(w.id, w.grad), name: w.name, desc: `Доход ×${w.mult}`, cur: "coin" };
      if (state.world === w.id) return { ...item, cls: "equipped", disabled: true, price: "Вы здесь" };
      if (state.worlds.includes(w.id)) return { ...item, price: "Перейти" };
      if (prev && !state.worlds.includes(prev.id))
        return { ...item, disabled: true, price: LOCK, desc: `${item.desc} · сначала открой «${prev.name}»` };
      if (state.rebirths < w.rebirths)
        return { ...item, disabled: true, price: `${LOCK} ${w.rebirths}`,
                 desc: `${item.desc} · нужно перерождений: ${w.rebirths} (есть ${state.rebirths})` };
      return { ...item, price: `${COIN} ${fmt(w.cost)}`, cost: w.cost };
    }

    function skinTile(s) {
      const owned = state.owned.includes(s.id);
      const equipped = state.skin === s.id;
      return `
        <button class="tile${equipped ? " equipped" : ""}" data-act="skin:${s.id}" style="--rar:${RARITY[s.r].c}"
                ${owned ? "" : `data-cost="${s.cost}" data-cur="coin"`} ${equipped ? "disabled" : ""}>
          <span class="skin-icon" style="${skinIconStyle(s)}">${s.glyph}</span>
          <span class="t-name">${s.name}</span>
          <span class="t-bonus">${s.bonus ? `+${fmt(s.bonus)} к клику` : "Без бонуса"}</span>

        </button>`;
    }

    const upgradeVisible = (u) => u.always || state.lv[u.id] > 0 || state.total >= u.base * 0.4;

    function upgradeItem(u) {
      const l = state.lv[u.id];
      const max = isMax(u);
      return itemHTML({
        act: `up:${u.id}`, cls: max ? "maxed" : "", disabled: max, lead: iconTile(u.id, u.grad),
        name: `${u.name} <span class="lv">ур. ${l}${u.max ? ` / ${u.max}` : ""}</span>`, desc: u.desc(l),
        price: max ? "МАКС" : `${COIN} ${fmt(upgradeCost(u))}`, cost: max ? null : upgradeCost(u), cur: "coin",
      });
    }

      const pct = Math.round(keepShare() * 100);
      return `
        <div class="pcard">

            <span class="pill keep">Награды</span><span class="pill keep">Постоянные улучшения</span>
            <span class="pill keep">${pct}% уровней улучшений</span></div>
          <div class="keep-row">Сбросится:

        </div>`;

    function sheetSub() {
      if (tab === "upgrades") return `Множитель дохода ×${multiplier().toFixed(2).replace(/\.?0+$/, "")}`;
      if (tab === "skins") return `${state.owned.length} из ${SKINS.length} собрано`;
      if (tab === "worlds") return `${state.worlds.length} из ${WORLDS.length} открыто`;
      if (tab === "rebirth") return `Перерождений: ${fmt(state.rebirths)}`;
      if (tab === "rewards") return `${state.claimed.length} из ${ACHS.length} достижений`;
      return "";
    }

    function renderList() {
      rebirthArmed = false;
      clearTimeout(armTimer);
      document.getElementById("sheet-title").textContent = TAB_TITLES[tab] || "";
      document.getElementById("sheet-sub").textContent = sheetSub();
      if (tab === "home") {
        listEl.innerHTML = "";
        return;
      }
      if (tab === "upgrades") {
        const hidden = UPGRADES.some((u) => !upgradeVisible(u));
        listEl.innerHTML = GROUPS.map((g) => {
          const items = UPGRADES.filter((u) => u.group === g && upgradeVisible(u));
          return items.length ? `<div class="section">${g}</div>${items.map(upgradeItem).join("")}` : "";
        }).join("") + (hidden ? '<div class="more">Новые улучшения откроются, когда заработаешь больше.</div>' : "");
      } else if (tab === "skins") {
        listEl.innerHTML = RARITY.map((r, i) => {
          const group = SKINS.filter((x) => x.r === i);
          return group.length
            ? `<div class="section" style="--rar:${r.c}"><i class="rar"></i>${r.n}</div>
               <div class="grid">${group.map(skinTile).join("")}</div>`
            : "";
        }).join("");
      } else if (tab === "worlds") {
        listEl.innerHTML = WORLDS.map((w, i) => itemHTML(worldItem(w, i))).join("");
      } else if (tab === "rewards") {
        const d = dailyInfo();
        const status = (a) => (state.claimed.includes(a.id) ? 2 : a.val() >= a.target ? 0 : 1);
        const rank = [...ACHS].sort((x, y) => status(x) - status(y) || y.val() / y.target - x.val() / x.target);
        listEl.innerHTML = itemHTML({
          act: "daily", cta: true, disabled: !d.claimable, lead: iconTile("gift", ACH_GRAD.mult),
          name: `Ежедневный подарок <span class="lv">серия ${d.streak}</span>`,
          desc: `+${fmt(d.coins)} монет${d.gems ? ` и ${d.gems} кристалла` : ""} · каждый 7-й день +3 кристалла`,
          price: d.claimable ? "Забрать" : "Завтра",
        }) + `<div class="section">Достижения · ${state.claimed.length} из ${ACHS.length}</div>` + rank.map((a) => {
          const v = Math.min(a.val(), a.target);
          const st = status(a);
          return itemHTML({
            act: `ach:${a.id}`, cta: st === 0, disabled: st !== 0, lead: iconTile(a.icon, a.grad), name: a.name,
            desc: `${a.desc}<i class="bar"><b style="width:${(v / a.target * 100).toFixed(1)}%"></b></i><span class="pg">${fmt(v)} / ${fmt(a.target)}</span>`,
            price: st === 2 ? "Получено" : `${GEM} ${st === 0 ? "+" : ""}${a.gems}`,
          });
        }).join("");
      } else {
        listEl.innerHTML = rebirthCard() + '<div class="section">Постоянные улучшения за кристаллы</div>' + PERMS.map((u) => {
          const lvl = state.perm[u.id];
          const maxed = lvl >= (u.max || Infinity);
          return itemHTML({
            act: `perm:${u.id}`, cls: maxed ? "maxed" : "", disabled: maxed, lead: iconTile(u.id, u.grad),
            name: `${u.name} <span class="lv">ур. ${lvl}${u.max ? ` / ${u.max}` : ""}</span>`, desc: u.desc(lvl),
            price: maxed ? "МАКС" : `${GEM} ${fmt(permCost(u))}`,
            cost: maxed ? null : permCost(u), cur: "gem",
          });
        }).join("");
      }
      updateRebirthCard();
      refreshAfford();
    }

    function refreshAfford() {
      listEl.querySelectorAll("[data-cost]").forEach((el) => {
        const have = el.dataset.cur === "gem" ? state.gems : state.score;
        el.disabled = have < Number(el.dataset.cost);
      });
    }

    function updateRebirthCard() {
      const btn = document.getElementById("rb-btn");
      if (!btn) return;
      const g = rebirthGain();
      const from = earnedForGems(g), to = earnedForGems(g + 1);
      document.getElementById("rb-gain").textContent = fmt(g);
      document.getElementById("rb-count").textContent = fmt(state.rebirths);
      document.getElementById("rb-gems").textContent = fmt(state.gems);
      document.getElementById("rb-bar").style.width = Math.min(100, Math.max(0, (state.earned - from) / (to - from) * 100)) + "%";
      document.getElementById("rb-next").textContent =
        `Заработано в этом забеге: ${fmt(state.earned)}. До ${fmt(g + 1)} ${g + 1 === 1 ? "кристалла" : "кристаллов"} осталось ${fmt(Math.ceil(to - state.earned))} монет.`;
      btn.disabled = g < 1;
      btn.classList.toggle("armed", rebirthArmed && g >= 1);
      if (g < 1) {
        btn.textContent = `Нужно заработать ещё ${fmt(Math.ceil(earnedForGems(1) - state.earned))} монет`;
      } else if (rebirthArmed) {
        btn.textContent = `Точно? Нажми ещё раз (+${fmt(g)} кристаллов)`;
      } else {
        btn.innerHTML = `Переродиться: +${fmt(g)} ${GEM}`;
      }
    }

    function renderLeague() {
      const L = leagueInfo();
      if (L.i !== shownLeague) {
        if (ready && shownLeague >= 0 && L.i > shownLeague) { toast(`Новая лига: ${L.cur.n}`); haptic("success"); }
        shownLeague = L.i;
        leagueEl.style.setProperty("--c1", L.cur.c[0]);
        leagueEl.style.setProperty("--c2", L.cur.c[1]);
        emblemEl.innerHTML = `${ICONS.shield}<b>${L.i + 1}</b>`;
        document.getElementById("lg-name").textContent = L.cur.n;
      }
      document.getElementById("lg-pct").textContent = L.next ? `${Math.floor(L.pct * 100)}%` : "Максимум";
      document.getElementById("lg-bar").style.width = (L.pct * 100).toFixed(1) + "%";
    }

    function renderStats() {
      scoreEl.textContent = fmt(state.score);
      scoreEl.toggleAttribute("data-long", scoreEl.textContent.length > 9);
      perClickEl.textContent = fmt(perClick());
      perSecEl.textContent = fmt(perSec());
      gemsEl.textContent = fmt(state.gems);
      const left = Math.ceil((buff.until - Date.now()) / 1000);
      buffEl.hidden = left <= 0;
      if (left > 0) buffEl.innerHTML = `${ICONS.bolt}<b>×${buff.mult}</b> клики · ${left} с`;
      renderLeague();
      refreshAfford();
      updateRebirthCard();
      const sig = ready ? claimable().join(",") : "";
      document.querySelector('.tab[data-tab="rewards"]').classList.toggle("has-badge", sig !== "");
      if (sig !== rewardSig) {
        rewardSig = sig;
        if (tab === "rewards") keepScroll(renderList);
      }
    }

    function keepScroll(fn) {
      const top = listEl.scrollTop;
      fn();
      listEl.scrollTop = top;
    }

    function haptic(kind) {
      if (!tg || !tg.HapticFeedback) return;
      if (kind === "success") tg.HapticFeedback.notificationOccurred("success");
      else if (kind === "crit") tg.HapticFeedback.impactOccurred("heavy");
      else tg.HapticFeedback.impactOccurred("light");
    }

    function showPlus(x, y, amount, crit) {
      const el = document.createElement("div");
      el.className = crit ? "plus crit" : "plus";
      el.textContent = "+" + fmt(amount);
      el.style.left = x + "px";
      el.style.top = y + "px";
      document.body.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }

    // a handful of sparks in the colour of the equipped skin
    function burst(x, y, crit) {
      if (calm.matches || !coin.animate || document.querySelectorAll(".spark").length > 60) return;
      const rgb = skinById(state.skin).glow;
      for (let i = 0; i < (crit ? 10 : 4); i++) {
        const el = document.createElement("i");
        el.className = "spark";
        el.style.left = x + "px";
        el.style.top = y + "px";
        el.style.background = el.style.color = `rgb(${rgb})`;
        document.body.appendChild(el);
        const a = Math.random() * Math.PI * 2;
        const d = 28 + Math.random() * (crit ? 90 : 50);
        el.animate([
          { transform: "translate(-50%, -50%) scale(1)", opacity: 1 },
          { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d}px)) scale(.2)`, opacity: 0 },
        ], { duration: 450 + Math.random() * 250, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => el.remove();
      }
    }

    function buyUpgrade(id) {
      const u = UPGRADES.find((x) => x.id === id);
      if (!u || isMax(u)) return;
      const cost = upgradeCost(u);
      if (state.score < cost) return;
      state.score -= cost;
      state.lv[id] += 1;
      haptic("success");
      renderStats();
      keepScroll(renderList);
      flush();
    }

    function buyPerm(id) {
      const u = PERMS.find((x) => x.id === id);
      if (!u || state.perm[id] >= (u.max || Infinity)) return;
      const cost = permCost(u);
      if (state.gems < cost) return;
      state.gems -= cost;
      state.perm[id] += 1;
      haptic("success");
      renderStats();
      keepScroll(renderList);
      flush();
    }

    // The manager buys the cheapest affordable income upgrade, a few per second at most.
    function autoBuy() {
      if (!state.perm.manager) return false;
      let bought = false;
      for (let n = 0; n < 5; n++) {
        let best = null, bestCost = Infinity;
        for (const u of GENS) {
          const c = upgradeCost(u);
          if (!isMax(u) && c <= state.score && c < bestCost) { best = u; bestCost = c; }
        }
        if (!best) break;
        state.score -= bestCost;
        state.lv[best.id] += 1;
        bought = true;
      }
      return bought;
    }

    function rebirth() {
      const g = rebirthGain();
      if (g < 1) return;
      if (!rebirthArmed) {
        rebirthArmed = true;
        armTimer = setTimeout(() => { rebirthArmed = false; updateRebirthCard(); }, 3000);
        updateRebirthCard();
        return;
      }
      const keep = keepShare();
      state.gems += g;
      state.rebirths += 1;
      state.score = startCoins();
      state.earned = 0;
      for (const id of Object.keys(state.lv)) state.lv[id] = Math.floor(state.lv[id] * keep);
      haptic("success");
      toast(`Перерождение: +${fmt(g)} кристаллов, осталось ${Math.round(keep * 100)}% уровней`);
      applySkin();
      renderStats();
      renderList();
      flush();
    }

    function useSkin(id) {
      const s = skinById(id);
      if (!state.owned.includes(s.id)) {
        if (state.score < s.cost) return;
        state.score -= s.cost;
        state.owned.push(s.id);
      }
      state.skin = s.id;
      haptic("success");
      applySkin();
      renderStats();
      keepScroll(renderList);
      flush();
    }

    const dayKey = (t = Date.now()) => new Date(t).toLocaleDateString("sv");
    function dailyInfo() {
      const claimable = state.daily.last !== dayKey();
      const streak = !claimable ? state.daily.streak
        : state.daily.last === dayKey(Date.now() - 864e5) ? state.daily.streak + 1 : 1;
      const coins = Math.round(Math.max(500, perSec() * 900) * Math.min(streak, 7));
      return { claimable, streak, coins, gems: streak % 7 === 0 ? 3 : 0 };
    }
    // ids of rewards that can be collected right now
    const claimable = () => [
      ...(dailyInfo().claimable ? ["daily"] : []),
      ...ACHS.filter((a) => !state.claimed.includes(a.id) && a.val() >= a.target).map((a) => a.id),
    ];

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3200);
    }

    function claimAch(id) {
      const a = ACHS.find((x) => x.id === id);
      if (!a || state.claimed.includes(id) || a.val() < a.target) return;
      state.claimed.push(id);
      state.gems += a.gems;
      toast(`«${a.name}»: +${a.gems} кристаллов`);
      haptic("success");
      renderStats();
      keepScroll(renderList);
      flush();
    }

    function claimDaily() {
      const d = dailyInfo();
      if (!d.claimable) return;
      state.daily = { last: dayKey(), streak: d.streak };
      addCoins(d.coins);
      state.gems += d.gems;
      toast(`Подарок дня: +${fmt(d.coins)} монет${d.gems ? ` и ${d.gems} кристалла` : ""}`);
      haptic("success");
      renderStats();
      keepScroll(renderList);
      flush();
    }

    // A golden coin drifts across the screen now and then: tap it for a lump sum or a click boost.
    function spawnGolden() {
      if (goldenEl) return;
      const el = document.createElement("button");
      el.className = "golden";
      el.setAttribute("aria-label", "Золотая монета");
      el.style.setProperty("--y", 14 + Math.random() * 40 + "%");
      el.addEventListener("animationend", (e) => {
        if (e.animationName === "cross") { el.remove(); goldenEl = null; }
      });
      el.addEventListener("pointerdown", (e) => { e.preventDefault(); catchGolden(e.clientX, e.clientY); });
      document.body.appendChild(el);
      goldenEl = el;
    }

    function catchGolden(x, y) {
      if (!goldenEl) return;
      goldenEl.remove();
      goldenEl = null;
      state.golden += 1;
      if (Math.random() < 0.5) {
        const lump = Math.round(Math.max(perSec() * 300, perClick() * 100));
        addCoins(lump);
        showPlus(x, y, lump, true);
        toast(`Золотая монета: куш +${fmt(lump)}`);
      } else {
        buff = { until: Date.now() + feverMs(), mult: 7 };
        toast(`Золотая лихорадка: клики ×7 на ${feverMs() / 1000} секунд`);
      }
      haptic("success");
      renderStats();
      flush();
    }

    function useWorld(id) {
      const i = WORLDS.findIndex((w) => w.id === id);
      const w = WORLDS[i];
      if (!w) return;
      if (!state.worlds.includes(w.id)) {
        if (i > 0 && !state.worlds.includes(WORLDS[i - 1].id)) return;
        if (state.rebirths < w.rebirths || state.score < w.cost) return;
        state.score -= w.cost;
        state.worlds.push(w.id);
      }
      state.world = w.id;
      haptic("success");
      applyWorld();
      renderStats();
      keepScroll(renderList);
      flush();
    }

    function pressCoin(x, y) {
      if (!ready) return;
      const crit = Math.random() < critChance();
      const gain = perClick() * (crit ? critMult() : 1);
      addCoins(gain);
      state.clicks += 1;
      renderStats();
      save();
      showPlus(x, y, gain, crit);
      burst(x, y, crit);
      coin.classList.add("pressed");
      haptic(crit ? "crit" : undefined);
    }

    // The coin leans towards the finger, like in other tap games.
    function release() {
      coin.classList.remove("pressed");
      coin.style.transform = "";
    }
    coin.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const r = coin.getBoundingClientRect();
      const dx = Math.max(-1, Math.min(1, (e.clientX - r.left - r.width / 2) / (r.width / 2)));
      const dy = Math.max(-1, Math.min(1, (e.clientY - r.top - r.height / 2) / (r.height / 2)));
      coin.style.transform = `perspective(520px) rotateX(${(-dy * 14).toFixed(1)}deg) rotateY(${(dx * 14).toFixed(1)}deg) scale(.95)`;
      pressCoin(e.clientX, e.clientY);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => coin.addEventListener(ev, release));

    const visibleTabs = () => [...tabs].filter((t) => t.offsetParent !== null);

    // Space clicks the coin, digits open sections. preventDefault stops page scroll and keeps Space
    // from also "pressing" whichever shop button happens to have focus.
    document.addEventListener("keydown", (e) => {
      if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key >= "1" && e.key <= "9") {
        const t = visibleTabs()[e.key - 1];
        if (t) setTab(t.dataset.tab);
        return;
      }
      if (e.code !== "Space") return;
      e.preventDefault();
      if (e.repeat || !coin.offsetParent) return;
      const r = coin.getBoundingClientRect();
      pressCoin(r.left + r.width / 2 + (Math.random() - 0.5) * r.width * 0.5, r.top + r.height * 0.3);
    });
    document.addEventListener("keyup", (e) => {
      if (e.code !== "Space") return;
      e.preventDefault();
      release();
    });

    listEl.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-act]");
      if (!btn || btn.disabled) return;
      const [kind, id] = btn.dataset.act.split(":");
      if (kind === "up") buyUpgrade(id);
      else if (kind === "perm") buyPerm(id);
      else if (kind === "rebirth") rebirth();
      else if (kind === "world") useWorld(id);
      else if (kind === "ach") claimAch(id);
      else if (kind === "daily") claimDaily();
      else useSkin(id);
    });

    function setTab(name) {
      if (name === "home" && wide.matches) name = "upgrades"; // the sidebar always shows a section
      tab = name;
      listEl.scrollTop = 0;
      mainEl.classList.toggle("open", name !== "home");
      tabs.forEach((x) => x.classList.toggle("active", x.dataset.tab === name));
      renderList();
    }
    tabs.forEach((t) => t.addEventListener("click", () => setTab(t.dataset.tab)));
    document.getElementById("world-pill").addEventListener("click", () => setTab("worlds"));
    wide.addEventListener("change", () => setTab(tab));

    setInterval(() => {
      if (!ready) return;
      const gain = perSec();
      if (gain) { addCoins(gain); save(); }
      if (autoBuy() && tab === "upgrades") keepScroll(renderList);
      if (!goldenEl && !document.hidden && Date.now() >= nextGolden) {
        spawnGolden();
        nextGolden = Date.now() + goldenGap();
      }
      renderStats();
    }, 1000);

    document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });
    window.addEventListener("pagehide", flush);

    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    }

    applySkin();
    applyWorld();
    renderStats();
    setTab(wide.matches ? "upgrades" : "home");
    load().then((s) => {
      state = s;
      ready = true;
      shownLeague = -1;
      const away = Math.min((Date.now() - state.lastSeen) / 1000, offlineCap());
      if (state.lastSeen && away >= 60 && perSec() > 0) {
        const gone = Math.floor(perSec() * away * offlineRate());
        addCoins(gone);
        toast(`Пока тебя не было: +${fmt(gone)} монет`);
        flush();
      }
      applySkin();
      if (state.world !== "meadow") applyWorld();
      renderStats();
      renderList();
    });
  </script>
</body>
</html>
