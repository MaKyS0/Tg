<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Coin Clicker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffd23f' stroke='%23d99000' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23d99000' stroke-width='2.5'/%3E%3C/svg%3E">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&family=Unbounded:wght@700;800&display=swap">
  <style>
    :root {
      /* Layout: phone = header (league, world, gems) / score / coin / bottom nav, shop screens slide in above the nav.
         Desktop = stage on the left, nav + shop as a sidebar on the right.
         Surfaces are tints of the Telegram text colour, so light and dark themes both work. */
      --bg: var(--tg-theme-bg-color, #101a20);
      --text: var(--tg-theme-text-color, #f2f7f6);
      --hint: var(--tg-theme-hint-color, #8aa0a8);
      --card: rgba(255, 255, 255, .07);
      --card-2: rgba(255, 255, 255, .13);
      --line: rgba(255, 255, 255, .14);
      --sheet: var(--bg);
      --accent: #ffc83d;
      --accent-ink: #ffd96e;
      --good: #3ddc97;
      --bad: #ff6b81;
      --side: clamp(380px, 38vw, 520px);
      --nav-h: 66px;
      --font-display: "Unbounded", "Arial Black", "Segoe UI", system-ui, sans-serif;
      --font-body: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @supports (color: color-mix(in srgb, red, blue)) {
      :root {
        --card: color-mix(in srgb, var(--text) 7%, transparent);
        --card-2: color-mix(in srgb, var(--text) 13%, transparent);
        --line: color-mix(in srgb, var(--text) 14%, transparent);
        --sheet: color-mix(in srgb, var(--bg) 86%, transparent);
        --accent-ink: color-mix(in srgb, var(--accent) 55%, var(--text));
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: var(--font-body);
      user-select: none; -webkit-user-select: none; overflow: hidden;
    }
    button { font-family: inherit; }
    main {
      position: relative; z-index: 1;
      height: 100%;
      display: flex; flex-direction: column; align-items: center;
    }
    main > * { width: 100%; max-width: 640px; }
    #sky { position: fixed; inset: 0; pointer-events: none; }
    .world-enter { animation: world-in .6s ease-out; }
    @keyframes world-in { from { opacity: 0; } to { opacity: 1; } }

    /* header: league progress, current world, gems */
    .hud { display: flex; align-items: center; gap: 8px; padding: 10px 12px 0; }
    .league {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px;
      padding: 5px 12px 5px 5px; border-radius: 16px; background: var(--card); border: 1px solid var(--line);
    }
    .emblem {
      position: relative; flex: none; width: 36px; height: 36px; border-radius: 12px; color: #fff;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--c1, #b4bec4), var(--c2, #6b7782));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -3px 6px rgba(0,0,0,.2), 0 3px 8px rgba(0,0,0,.25);
    }
    .emblem svg { position: absolute; width: 28px; height: 28px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.3)); }
    .emblem b { position: relative; font-family: var(--font-display); font-size: 11px; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
    .lg-info { flex: 1; min-width: 0; }
    .lg-name { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 800; }
    .lg-name > #lg-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lg-name span { color: var(--hint); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .meter { display: block; height: 6px; margin-top: 5px; border-radius: 3px; background: var(--card-2); overflow: hidden; }
    .meter b { display: block; width: 0; height: 100%; border-radius: 3px; transition: width .3s; background: linear-gradient(90deg, var(--c1, var(--accent)), var(--c2, #ff9d2e)); }
    .world-pill {
      display: inline-flex; align-items: center; gap: 6px; flex: none;
      padding: 4px 11px 4px 4px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--card); color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .world-pill .dot { width: 26px; height: 26px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; }
    .world-pill .dot svg { width: 15px; height: 15px; }
    .world-pill b { font-family: var(--font-display); font-size: 12px; color: var(--accent-ink); }
    #world-name { display: none; }
    .gems-chip { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 9px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }

    /* score */
    .score-box { text-align: center; padding: 8px 16px 0; }
    .score-line { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .score-line > svg { width: clamp(26px, 8vw, 38px); height: clamp(26px, 8vw, 38px); flex: none; filter: drop-shadow(0 2px 6px rgba(255, 190, 0, .5)); }
    #score {
      font-family: var(--font-display); font-weight: 800; line-height: 1.15;
      font-size: clamp(28px, 10vw, 44px); font-variant-numeric: tabular-nums;
    }
    #score[data-long] { font-size: clamp(22px, 7.4vw, 32px); }
    .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 6px; }
    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px 4px 8px; border-radius: 999px; background: var(--card);
      color: var(--hint); font-size: 12px; font-weight: 500;
    }
    .chip b { color: var(--text); font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .chip svg { width: 14px; height: 14px; }
    .chip b.pos::before { content: "+"; }
    .buff { background: rgba(255, 200, 61, .16); box-shadow: inset 0 0 0 1px rgba(255, 200, 61, .5); color: var(--accent-ink); }
    .buff[hidden] { display: none; }
    .buff svg { color: var(--accent); }
    .buff b { color: var(--accent-ink); }

    /* stage */
    .coin-wrap { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; max-width: none; }
    .coin-holder { position: relative; z-index: 1; text-align: center; padding-top: 8px; }
    .coin-stage { position: relative; display: inline-block; --glow: 255, 190, 0; }
    .halo {
      position: absolute; inset: -26%; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(var(--glow), .34) 0%, transparent 62%);
      animation: breathe 3.2s ease-in-out infinite;
    }
    .ring {
      position: absolute; inset: -8%; border-radius: var(--shape, 50%); pointer-events: none;
      border: 2px dashed rgba(var(--glow), .5); animation: spin 50s linear infinite;
    }
    @keyframes breathe { 0%, 100% { transform: scale(.94); opacity: .75; } 50% { transform: scale(1.04); opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    #scene {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: min(100%, 640px); height: 42%; pointer-events: none;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
    }
    #scene svg { display: block; width: 100%; height: 100%; }
    #coin {
      position: relative;
      width: min(62vw, 38vh, 300px); aspect-ratio: 1; border: none; border-radius: 50%; padding: 0;
      cursor: pointer; touch-action: manipulation;
      transition: transform .12s ease-out;
      font-family: var(--font-display);
      font-size: min(26vw, 16vh, 130px); font-weight: 800;
    }
    #coin.pressed { transform: scale(.92); }
    #coin.holo { animation: holo 6s linear infinite; }
    @keyframes holo { to { filter: hue-rotate(360deg); } }
    #coin.pulse { animation: glint 1.8s ease-in-out infinite; }
    @keyframes glint { 50% { filter: brightness(1.3) saturate(1.25); } }
    #coin .g { display: inline-block; }
    #coin.spin .g { animation: gflip 3.6s ease-in-out infinite; }
    @keyframes gflip { 0%, 55% { transform: rotateY(0); } 100% { transform: rotateY(360deg); } }
    #coin::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; }
    #coin.shine::after {
      opacity: 1; background: linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, .6) 50%, transparent 62%) -150% 0 / 250% 100% no-repeat;
      animation: sweep 3s ease-in-out infinite;
    }
    @keyframes sweep { to { background-position: 250% 0; } }
    #coin.flame { animation: flicker .9s ease-in-out infinite alternate; }
    @keyframes flicker {
      0% { filter: brightness(1) drop-shadow(0 0 6px rgba(255, 120, 0, .6)); }
      50% { filter: brightness(1.18) drop-shadow(0 -6px 16px rgba(255, 170, 0, .9)); }
      100% { filter: brightness(1.05) drop-shadow(0 -2px 10px rgba(255, 90, 0, .7)); }
    }
    #coin.glitch .g { animation: glitch 2.4s steps(1) infinite; }
    @keyframes glitch {
      0%, 88%, 100% { transform: none; text-shadow: none; }
      90% { transform: translate(-5px, 2px); text-shadow: 5px 0 #0ff, -5px 0 #f0f; }
      94% { transform: translate(5px, -2px); text-shadow: -5px 0 #0ff, 5px 0 #f0f; }
      97% { transform: translate(-2px, 0); text-shadow: 3px 0 #0ff, -3px 0 #f0f; }
    }
    #coin.orbit::before {
      content: ""; position: absolute; inset: -7%; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 50% 0, rgb(var(--glow)) 0 4%, transparent 5%); animation: spin 4s linear infinite;
    }
    .combo { display: block; width: min(64%, 220px); height: 6px; margin: 14px auto 0; border-radius: 3px; background: var(--card-2); overflow: hidden; }
    .combo b { display: block; width: 0; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #7c5cff, #ff4f9a); transition: width .15s; }
    .combo.frenzy b { background: linear-gradient(90deg, var(--accent), #ff5a1f); box-shadow: 0 0 10px rgba(255, 140, 0, .8); }
    .skills { display: flex; justify-content: center; gap: 12px; margin-top: 12px; }
    .skill { position: relative; width: 48px; height: 48px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--card-2); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .skill[hidden] { display: none; }
    .skill svg { width: 22px; height: 22px; }
    .skill .cd { position: absolute; inset: 0; border-radius: 50%; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, .6); color: #fff; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .skill.cooling .cd { display: flex; }
    .skill.cooling { cursor: default; }
    .skill.on { box-shadow: 0 0 0 2px var(--accent), 0 0 16px rgba(255, 200, 61, .7); color: var(--accent); }
    .exp-card { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
    .exp-btns { display: flex; gap: 8px; }
    .exp-btns button { flex: 1; padding: 10px 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--card-2); color: var(--text); font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
    .kbd-hint { display: none; color: var(--hint); font-size: 12px; margin-top: 10px; }

    /* world particles: each <i> gets --s (size), --d (duration), --dl (negative delay) inline */
    #fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    #fx i { position: absolute; width: var(--s); height: var(--s); border-radius: 50%; }
    .fx-firefly i { background: #d9f99d; box-shadow: 0 0 8px #84cc16; animation: hover var(--d) ease-in-out var(--dl) infinite; }
    .fx-sand i { background: #f5c451; animation: blow var(--d) linear var(--dl) infinite, sway 1.6s ease-in-out infinite alternate; }
    .fx-snow i { background: #e0f2fe; box-shadow: 0 0 4px #38bdf8; animation: fall var(--d) linear var(--dl) infinite, sway 2.4s ease-in-out infinite alternate; }
    .fx-ember i { background: #ffb347; box-shadow: 0 0 6px #ff5a00; animation: rise var(--d) ease-in var(--dl) infinite, sway 1.2s ease-in-out infinite alternate; }
    .fx-bubble i { border: 1.5px solid rgba(34, 211, 238, .8); animation: rise var(--d) linear var(--dl) infinite, sway 2s ease-in-out infinite alternate; }
    .fx-star i { background: #ddd6fe; box-shadow: 0 0 6px #a78bfa; animation: twinkle var(--d) ease-in-out var(--dl) infinite; }
    .fx-leaf i, .fx-petal i { width: calc(var(--s) * 2); height: calc(var(--s) * 2); border-radius: 0 100% 0 100%; animation: fall var(--d) linear var(--dl) infinite, sway 2.2s ease-in-out infinite alternate; }
    .fx-leaf i { background: #8fd14f; }
    .fx-leaf i:nth-child(3n) { background: #e8a33d; }
    .fx-petal i { background: #ffc2dd; }
    .fx-petal i:nth-child(3n) { background: #fff; }
    .fx-spore i { background: #c5f06a; box-shadow: 0 0 8px #8ab82a; animation: rise var(--d) ease-in var(--dl) infinite, sway 3s ease-in-out infinite alternate; }
    .fx-rain i { width: 1.5px; height: calc(var(--s) * 6); border-radius: 1px; background: linear-gradient(#4ff0ff, transparent); animation: fall var(--d) linear var(--dl) infinite; }
    .fx-crystal i { rotate: 45deg; border-radius: 2px; background: #c4f1ff; box-shadow: 0 0 8px #7ff0ff; animation: twinkle var(--d) ease-in-out var(--dl) infinite; }
    .fx-foam i { background: #fff; opacity: .8; animation: rise var(--d) ease-out var(--dl) infinite, sway 2.5s ease-in-out infinite alternate; }
    .fx-glow i { background: #f0abfc; box-shadow: 0 0 10px #e879f9; animation: hover var(--d) ease-in-out var(--dl) infinite; }
    .fx-gold i { background: #ffe08a; box-shadow: 0 0 8px #ffc83d; animation: twinkle var(--d) ease-in-out var(--dl) infinite; }
    .fx-confetti i { width: calc(var(--s) * 1.4); height: calc(var(--s) * .8); border-radius: 1px; animation: fall var(--d) linear var(--dl) infinite, sway 1.4s ease-in-out infinite alternate; }
    .fx-confetti i:nth-child(4n+1) { background: #ff6b9d; }
    .fx-confetti i:nth-child(4n+2) { background: #4dd0e1; }
    .fx-confetti i:nth-child(4n+3) { background: #ffd93d; }
    .fx-confetti i:nth-child(4n) { background: #a78bfa; }
    .fx-mist i { width: calc(var(--s) * 9); height: calc(var(--s) * 9); border-radius: 50%; background: radial-gradient(circle, rgba(220, 255, 230, .3), transparent 70%); animation: blow var(--d) linear var(--dl) infinite; }
    .fx-plankton i { background: #7ff7ff; box-shadow: 0 0 8px #22d3ee; animation: hover var(--d) ease-in-out var(--dl) infinite; }
    .fx-meteor i { width: calc(var(--s) * 9); height: 2px; border-radius: 2px; rotate: -30deg; background: linear-gradient(90deg, transparent, #fff); animation: shoot var(--d) linear var(--dl) infinite; }
    .fx-pixel i { border-radius: 0; animation: twinkle var(--d) steps(3) var(--dl) infinite; }
    .fx-pixel i:nth-child(4n+1) { background: #ff6b6b; }
    .fx-pixel i:nth-child(4n+2) { background: #ffd93d; }
    .fx-pixel i:nth-child(4n+3) { background: #6bcb77; }
    .fx-pixel i:nth-child(4n) { background: #4d96ff; }
    .fx-flash i { width: 2px; height: calc(var(--s) * 9); border-radius: 1px; background: linear-gradient(#fff, #9ec5ff); box-shadow: 0 0 10px #9ec5ff; animation: flash var(--d) steps(1) var(--dl) infinite; }
    @keyframes shoot { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(-260px, 150px); opacity: 0; } }
    @keyframes flash { 0%, 92%, 100% { opacity: 0; } 94%, 98% { opacity: 1; } }
    .fx-swirl i { background: #c4b5fd; box-shadow: 0 0 8px #8b5cf6; animation: suck var(--d) ease-in var(--dl) infinite; }
    @keyframes suck { 0% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(0, 0) scale(.2); opacity: 0; } }
    @keyframes fall { from { top: -4%; } to { top: 104%; } }
    @keyframes rise { from { top: 104%; opacity: 1; } to { top: -4%; opacity: 0; } }
    @keyframes blow { from { left: -4%; } to { left: 104%; } }
    @keyframes sway { from { transform: translateX(-6px); } to { transform: translateX(6px); } }
    @keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.5); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes hover { 0%, 100% { opacity: .2; transform: translate(0, 0); } 50% { opacity: 1; transform: translate(14px, -20px); } }

    /* floating numbers, sparks, golden coin, toast */
    .plus {
      position: fixed; z-index: 10; pointer-events: none;
      font-family: var(--font-display); font-size: 22px; font-weight: 800; color: var(--accent);
      text-shadow: 0 2px 6px rgba(0,0,0,.5);
      animation: float .8s ease-out forwards;
    }
    .plus.crit { font-size: 30px; color: #ff6aa8; }
    @keyframes float {
      from { opacity: 1; transform: translate(-50%, -50%); }
      to   { opacity: 0; transform: translate(-50%, -150px); }
    }
    .spark { position: fixed; z-index: 8; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; box-shadow: 0 0 8px currentColor; }
    .golden {
      position: fixed; z-index: 9; left: -64px; top: var(--y); width: 54px; height: 54px; padding: 0; border: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation;
      background: radial-gradient(circle at 35% 30%, #fff6a8, #ffd23f 35%, #f0a500 75%, #b8740a);
      box-shadow: inset 0 0 0 4px #d99000, 0 0 22px 6px rgba(255, 200, 0, .6);
      animation: cross 9s linear forwards, bob 1s ease-in-out infinite alternate;
    }
    .golden::after { content: "$"; font-family: var(--font-display); font-weight: 800; font-size: 24px; color: #b06a00; }
    @keyframes cross { to { left: 100vw; } }
    @keyframes bob { from { transform: translateY(-14px) rotate(-8deg); } to { transform: translateY(14px) rotate(8deg); } }
    #toast {
      position: fixed; z-index: 60; left: 50%; bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom)); max-width: 90%; text-align: center;
      padding: 9px 15px; border-radius: 14px; background: var(--text); color: var(--bg);
      font-size: 13px; font-weight: 700; pointer-events: none;
      opacity: 0; transform: translate(-50%, 8px); transition: opacity .2s, transform .2s;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (prefers-reduced-motion: reduce) {
      #fx { display: none; }
      .combo b { transition: none; }
      .halo, .ring, #coin.holo, #coin.pulse, #coin.flame, #coin.glitch .g, #coin.spin .g, #coin.shine::after, #coin.orbit::before { animation: none; }
      .wheel { transition: none; }
      .golden { animation: cross 14s linear forwards; }
    }

    /* shop screen (phone: replaces the coin while a section is open) */
    .panel {
      display: none; flex: 1; min-height: 0; flex-direction: column; gap: 10px;
      margin-top: 10px; padding: 14px 12px 8px;
      background: var(--sheet); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      border-top: 1px solid var(--line); border-radius: 22px 22px 0 0;
    }
    main.open .panel { display: flex; }
    main.open .coin-wrap { display: none; }
    .sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 4px; }
    #sheet-title { margin: 0; font-family: var(--font-display); font-size: 18px; font-weight: 800; }
    #sheet-sub { color: var(--hint); font-size: 12px; font-weight: 500; text-align: right; }
    .list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--card-2) transparent; }

    /* bottom navigation */
    .tabs {
      flex: none; display: flex; gap: 1px; padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
      background: var(--sheet); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      border-top: 1px solid var(--line);
    }
    .tab {
      position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 8px 0 7px; border: none; border-radius: 14px; background: transparent; color: var(--hint);
      font-size: clamp(9px, 2.6vw, 10.5px); font-weight: 700; cursor: pointer;
      transition: color .15s, background .15s;
    }
    .tab svg { width: 22px; height: 22px; display: block; }
    .tl { max-width: 100%; overflow: hidden; white-space: nowrap; }
    .tab.active { color: var(--text); background: var(--card-2); }
    .tab.active svg { color: var(--accent-ink); filter: drop-shadow(0 0 6px rgba(255, 200, 61, .55)); }
    .badge { display: none; position: absolute; top: 5px; left: calc(50% + 7px); width: 9px; height: 9px; border-radius: 50%; background: #ff4f6d; box-shadow: 0 0 0 2px var(--bg); }
    .tab.has-badge:not(.active) .badge { display: block; }
    @media (max-width: 340px) {
      .tab:not(.active) .tl { display: none; }
      .tab.active { flex: 2.4 1 0; }
      .tab { padding: 10px 0 9px; }
    }
    .tab[data-tab="upgrades"] .badge { background: var(--good); }
    .tab[data-tab="rebirth"] .badge { background: #a78bfa; }

    /* list rows */
    .item {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 10px 12px; border: 1px solid transparent; border-radius: 16px; text-align: left;
      background: var(--card); color: var(--text); font: inherit; cursor: pointer;
      transition: transform .1s ease-out;
    }
    .item:disabled, .tile:disabled { opacity: .5; cursor: default; }
    .item.equipped, .item.maxed, .tile.equipped { opacity: 1; }
    .item.equipped, .tile.equipped { border-color: var(--accent); background: rgba(255, 200, 61, .1); }
    .icon {
      width: 42px; height: 42px; border-radius: 13px; flex: none; color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -3px 6px rgba(0,0,0,.18), 0 3px 8px rgba(0,0,0,.25);
    }
    .icon svg { width: 24px; height: 24px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.3)); }
    .cur { width: 15px; height: 15px; vertical-align: -2px; flex: none; }
    .info { flex: 1; min-width: 0; }
    .name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .lv { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--card-2); color: var(--hint); }
    .desc { color: var(--hint); font-size: 13px; margin-top: 1px; }
    .price {
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
      padding: 6px 11px; border-radius: 999px; font-weight: 800; font-size: 14px;
      color: var(--accent-ink); background: rgba(255, 200, 61, .16); box-shadow: inset 0 0 0 1px rgba(255, 200, 61, .5);
    }
    .item:disabled .price, .tile:disabled .price { background: var(--card-2); box-shadow: none; color: var(--hint); }
    .item:not(:disabled) .price.free, .tile:not(:disabled) .price.free { background: var(--card-2); box-shadow: none; color: var(--text); }
    .item.equipped .price, .tile.equipped .price { color: var(--accent-ink); }
    .section { color: var(--hint); font-size: 13px; font-weight: 700; padding: 8px 4px 0; display: flex; align-items: center; gap: 7px; }
    .sec-n { margin-left: auto; font-size: 12px; font-weight: 600; }
    .sec-n.done { color: var(--good); }
    .section .rar { width: 8px; height: 8px; border-radius: 50%; background: var(--rar); box-shadow: 0 0 8px var(--rar); }
    .more { color: var(--hint); font-size: 12px; text-align: center; padding: 6px 12px 2px; }
    .bar { display: block; height: 5px; margin: 6px 0 2px; border-radius: 3px; background: var(--card-2); overflow: hidden; }
    .bar b { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), #ff9d2e); }
    .pg { font-size: 11px; }

    /* skin tiles */
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .tile {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 12px 6px 8px; border: 1px solid transparent; border-radius: 16px;
      background: var(--card); color: var(--text); font: inherit; cursor: pointer; text-align: center;
      transition: transform .1s ease-out;
    }
    .tile::after { content: ""; position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--rar); box-shadow: 0 0 7px var(--rar); }
    .skin-icon {
      width: 50px; height: 50px; border-radius: 50%; flex: none; margin-bottom: 3px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-weight: 800; font-size: 22px;
    }
    .t-name { font-weight: 700; font-size: 13px; }
    .t-bonus { color: var(--hint); font-size: 11px; margin-bottom: 4px; }
    .tile .price { font-size: 11px; padding: 3px 6px; gap: 2px; max-width: 100%; }
    .tile .price .cur { width: 12px; height: 12px; }
    .t-name.long { font-size: 11px; }

    /* wheel of fortune */
    .wheel-card { display: flex; align-items: center; gap: 16px; padding: 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
    .wheel-box { position: relative; flex: none; width: 134px; height: 134px; margin: 6px 0 0 4px; }
    .wheel { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 4px var(--card-2), 0 6px 16px rgba(0, 0, 0, .3); transition: transform 3.4s cubic-bezier(.12, .7, .1, 1); }
    .wheel.noanim { transition: none; }
    .wheel span { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
    .wheel b { position: absolute; left: -24px; top: -60px; width: 48px; display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .65); }
    .pointer { position: absolute; z-index: 2; top: -10px; left: 50%; transform: translateX(-50%); border: 8px solid transparent; border-top: 14px solid var(--text); }
    .wheel-side { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .spin-btn { border: none; border-radius: 12px; padding: 10px 14px; font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; color: #2b1d00; background: var(--accent); }
    .spin-btn:disabled { opacity: .5; cursor: default; background: var(--card-2); color: var(--hint); }

    /* prestige */
    .pcard {
      display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(124, 92, 255, .22), rgba(255, 79, 154, .16));
    }
    .p-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
    .p-gain { display: flex; flex-direction: column; gap: 2px; }
    .p-label { color: var(--hint); font-size: 12px; }
    .p-gain b { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: 28px; line-height: 1.1; }
    .p-gain .cur { width: 22px; height: 22px; }
    .p-stat { color: var(--hint); font-size: 12px; text-align: right; line-height: 1.5; }
    .p-stat b { color: var(--text); font-weight: 800; }
    .keep-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--hint); }
    .pill { padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--text); background: var(--card); }
    .pill.keep { box-shadow: inset 0 0 0 1px var(--good); }
    .pill.lose { box-shadow: inset 0 0 0 1px var(--bad); }
    .rebirth-btn {
      border: none; border-radius: 14px; padding: 13px; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer;
      color: #fff; background: linear-gradient(135deg, #7c5cff, #ff4f9a);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 14px rgba(255, 79, 154, .35);
    }
    .rebirth-btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
    .rebirth-btn.armed { background: linear-gradient(135deg, #ef4444, #f97316); }

    /* leaderboard */
    .league { cursor: pointer; }
    .tsort { display: flex; gap: 6px; }
    .tsort .chipbtn { flex: 1; padding: 8px 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--hint); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
    .tsort .chipbtn.on { background: var(--text); color: var(--bg); border-color: transparent; }
    .tme { display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); background: linear-gradient(135deg, rgba(255, 200, 61, .16), rgba(255, 90, 31, .1)); }
    .tme b { font-family: var(--font-display); font-size: 18px; }
    .tme span { color: var(--hint); font-size: 12px; }
    .trow { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 14px; background: var(--card); border: 1px solid transparent; }
    .trow.me { border-color: var(--accent); background: rgba(255, 200, 61, .1); }
    .rk { flex: none; width: 26px; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 13px; color: var(--hint); }
    .trow.r1 .rk { color: #ffc83d; font-size: 16px; } .trow.r2 .rk { color: #cfd8e0; font-size: 15px; } .trow.r3 .rk { color: #e0955a; font-size: 14px; }
    .emblem.sm { width: 30px; height: 30px; border-radius: 10px; }
    .emblem.sm svg { width: 22px; height: 22px; }
    .emblem.sm b { font-size: 9px; }
    .tn { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .tn b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tn i { font-style: normal; color: var(--hint); font-size: 11px; }
    .tv { flex: none; font-weight: 800; font-size: 14px; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
    .tstate { text-align: center; color: var(--hint); font-size: 13px; padding: 24px 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
    .tstate button { padding: 8px 16px; border: none; border-radius: 12px; background: var(--accent); color: #2b1d00; font: inherit; font-weight: 800; cursor: pointer; }
    .statgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .stat { padding: 10px 12px; border-radius: 14px; background: var(--card); }
    .stat b { display: block; font-family: var(--font-display); font-size: 14px; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--hint); font-size: 12px; }
    .item.danger { border-color: var(--bad); background: rgba(255, 107, 129, .12); }
    .item.danger .price { color: var(--bad); background: rgba(255, 107, 129, .16); box-shadow: inset 0 0 0 1px var(--bad); }

    /* keyboard focus */
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tab:focus-visible { outline-offset: -2px; }

    /* mouse: hover feedback */
    @media (hover: hover) {
      .kbd-hint { display: block; }
      .item:not(:disabled):hover, .tile:not(:disabled):hover { background: var(--card-2); transform: translateY(-1px); }
      .item:not(:disabled):active, .tile:not(:disabled):active { transform: scale(.975); }
      .tab:not(.active):hover { color: var(--text); background: var(--card); }
      .world-pill:hover { background: var(--card-2); }
      #coin:hover { transform: scale(1.03); }
      #coin.pressed, #coin.pressed:hover { transform: scale(.92); }
    }

    /* desktop and landscape: stage on the left, nav + shop as a sidebar on the right */
    @media (min-width: 760px) and (min-aspect-ratio: 1/1) {
      main {
        display: grid; grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: auto auto minmax(0, 1fr);
        grid-template-areas: "hud nav" "score panel" "stage panel";
        align-items: stretch; justify-items: stretch;
      }
      main > * { max-width: none; }
      .hud { grid-area: hud; justify-content: center; padding: 16px 20px 0; }
      .league { flex: 0 1 340px; }
      #world-name { display: inline; }
      .score-box { grid-area: score; padding-top: 12px; }
      #score { font-size: clamp(36px, 7.5vh, 68px); }
      #score[data-long] { font-size: clamp(28px, 5.6vh, 50px); }
      .score-line > svg { width: clamp(34px, 6vh, 52px); height: clamp(34px, 6vh, 52px); }
      .stats { gap: 8px; margin-top: 10px; }
      .chip { font-size: 13px; padding: 5px 12px 5px 10px; }
      .chip b { font-size: 14px; }
      .chip svg { width: 16px; height: 16px; }
      .coin-wrap { grid-area: stage; }
      main.open .coin-wrap { display: flex; }
      #scene { width: min(100%, 980px); height: 38%; }
      #coin { width: min(34vw, 40vh, 400px); font-size: min(14vw, 17vh, 170px); }
      .kbd-hint { font-size: 13px; margin-top: 16px; }
      .plus { font-size: 28px; }
      .plus.crit { font-size: 38px; }
      .tabs {
        grid-area: nav; align-items: stretch; padding: 10px 14px;
        border-top: none; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line);
      }
      .tab { font-size: 11px; padding: 9px 0 8px; }
      .tab:not(.active) .tl { display: block; }
      .tab.active { flex: 1 1 0; }
      .tab[data-tab="home"] { display: none; }
      .badge { left: calc(50% + 9px); }
      .panel, main.open .panel {
        grid-area: panel; display: flex; margin-top: 0; padding: 16px;
        border-top: none; border-left: 1px solid var(--line); border-radius: 0;
      }
      #sheet-title { font-size: 20px; }
      .list { gap: 10px; padding-right: 2px; }
      .item { padding: 12px 14px; }
      .name { font-size: 16px; }
      .desc { font-size: 14px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
      .tile { padding: 14px 6px 10px; }
      #toast { left: calc((100vw - var(--side)) / 2); bottom: 28px; }
    }

    /* season 2: new particles, modal, rebirth banner and ceremony, avatars, animations */
    .fx-ash i { background: #9ca3af; animation: fall var(--d) linear var(--dl) infinite, sway 2.8s ease-in-out infinite alternate; opacity: .7; }
    .fx-orb i { width: calc(var(--s) * 4); height: calc(var(--s) * 4); border-radius: 50%; background: radial-gradient(circle, rgba(240, 171, 252, .7), transparent 70%); animation: hover var(--d) ease-in-out var(--dl) infinite; }
    .fx-shard i { rotate: 45deg; width: calc(var(--s) * 1.4); height: calc(var(--s) * 3); border-radius: 2px; background: linear-gradient(#fde68a, #a855f7); box-shadow: 0 0 8px #c084fc; animation: fall var(--d) linear var(--dl) infinite, twinkle 2s ease-in-out infinite; }

    .qrow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
    .qrow .qbtn { font-size: 10px; padding: 9px 1px 7px; white-space: nowrap; }
    .qrow .qi { width: 34px; height: 34px; }
    .qbtn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px 10px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; transition: transform .15s, background .15s; }
    .qbtn:active { transform: scale(.96); }
    .qbtn .qi { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-size: 22px; line-height: 1; }
    .qbtn .qi svg { width: 22px; height: 22px; }
    .qbtn.new::after { content: "NEW"; position: absolute; top: 6px; right: 6px; font-size: 9px; font-weight: 800; padding: 2px 5px; border-radius: 8px; background: #ff4f6d; color: #fff; }
    .av { display: grid; place-items: center; border-radius: 50%; line-height: 1; flex: none; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35); }
    .av.sm { width: 26px; height: 26px; font-size: 15px; }
    .av.lg { width: 76px; height: 76px; font-size: 42px; }

    .rbchip { border: none; cursor: pointer; background: linear-gradient(135deg, #7c5cff, #ff4f9a); color: #fff; font: inherit; font-size: 12px; font-weight: 800; animation: banner-pulse 2s ease-in-out infinite; }
    .rbchip[hidden] { display: none; }
    .rbchip svg { width: 15px; height: 15px; }
    @keyframes banner-pulse { 0%, 100% { box-shadow: 0 8px 28px rgba(124, 92, 255, .5); } 50% { box-shadow: 0 8px 36px rgba(255, 79, 154, .8); } }

    .modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, .55); backdrop-filter: blur(3px); animation: fade-in .2s ease-out; }
    .modal[hidden] { display: none; }
    .mcard {
      position: relative; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
      padding: 20px 16px 22px; border-radius: 24px 24px 0 0; background: var(--bg); border: 1px solid var(--line); border-bottom: none;
      animation: sheet-up .32s cubic-bezier(.2, 1, .3, 1);
    }
    .mcard h3 { margin: 0 28px 12px 0; font-family: var(--font-display); font-size: 18px; }
    .mclose { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--card-2); color: var(--text); font-size: 18px; line-height: 1; cursor: pointer; }
    .mcard .sub { color: var(--hint); font-size: 13px; margin-bottom: 12px; }
    .avgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; margin-top: 12px; }
    .avbtn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px 6px; border-radius: 14px; border: 2px solid transparent; background: var(--card); color: var(--text); font: inherit; font-size: 10px; cursor: pointer; }
    .avbtn.sel { border-color: var(--accent); background: rgba(255, 200, 61, .12); }
    .avbtn.lock .av { filter: grayscale(1) brightness(.6); }
    .avbtn.lock { color: var(--hint); }
    .avbtn:active { transform: scale(.95); }
    .prof { display: flex; align-items: center; gap: 14px; }
    .prof b { font-family: var(--font-display); font-size: 16px; display: block; }
    .prof span { color: var(--hint); font-size: 13px; }
    .pform { display: flex; gap: 8px; }
    .pform input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; user-select: text; -webkit-user-select: text; }
    .pform button, .mok { padding: 12px 18px; border: none; border-radius: 14px; background: var(--accent); color: #2b1d00; font: inherit; font-weight: 800; cursor: pointer; }
    .mok { width: 100%; margin-top: 14px; }
    .pmsg { min-height: 20px; margin-top: 10px; font-size: 13px; font-weight: 700; }
    .pmsg.ok { color: var(--good); } .pmsg.bad { color: var(--bad); }
    .petgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
    .petcard { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 12px 8px 10px; border-radius: 16px; background: var(--card); border: 1px solid var(--rar); text-align: center; }
    .petcard.lock { opacity: .55; border-color: var(--line); }
    .petcard .pe { font-size: 34px; line-height: 1.1; }
    .petcard b { font-size: 13px; }
    .petcard .pr { font-size: 10px; font-weight: 800; color: var(--rar); }
    .petcard .pl { display: flex; gap: 3px; }
    .petcard .pl i { width: 8px; height: 8px; border-radius: 50%; background: var(--card-2); }
    .petcard .pl i.on { background: var(--rar); box-shadow: 0 0 6px var(--rar); }
    .petcard .pd { color: var(--hint); font-size: 11px; line-height: 1.3; }
    .talgrid { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 4px; }
    .talrow { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 14px; background: var(--card); }
    .talrow .te { font-size: 26px; flex: none; width: 34px; text-align: center; }
    .talrow .ti { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .talrow .ti b { font-size: 13px; }
    .talrow .ti span { color: var(--hint); font-size: 11px; }
    .talrow .pl { display: flex; gap: 3px; }
    .talrow .pl i { width: 8px; height: 8px; border-radius: 50%; background: var(--card-2); }
    .talrow .pl i.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .talrow button { flex: none; padding: 8px 12px; border: none; border-radius: 12px; background: var(--accent); color: #2b1d00; font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; }
    .talrow button:disabled { background: var(--card-2); color: var(--hint); cursor: default; }
    .mok:disabled { background: var(--card-2); color: var(--hint); }
    .clog { margin-bottom: 16px; }
    .clog h4 { margin: 0 0 6px; display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .clog h4 b { padding: 2px 8px; border-radius: 8px; background: var(--accent); color: #2b1d00; font-size: 12px; }
    .clog ul { margin: 0; padding-left: 18px; color: var(--hint); font-size: 13px; line-height: 1.55; }
    .clog li::marker { color: var(--accent); }

    .boom { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; pointer-events: none; overflow: hidden; animation: boom-life 2.4s ease-out forwards; }
    .boom::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(255, 255, 255, .95), rgba(124, 92, 255, .55) 40%, transparent 70%); animation: boom-flash 1.1s ease-out forwards; }
    .boom i { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 3px solid #c4b5fd; animation: boom-ring 1.6s cubic-bezier(.1, .7, .3, 1) forwards; }
    .boom i:nth-child(2) { border-color: #ff4f9a; animation-delay: .15s; }
    .boom i:nth-child(3) { border-color: #ffd23f; animation-delay: .3s; }
    .boom .bt { position: relative; max-width: 86vw; padding: 16px 22px; border-radius: 22px; background: rgba(18, 10, 48, .62); backdrop-filter: blur(6px); text-align: center; font-family: var(--font-display); color: #fff; text-shadow: 0 4px 24px rgba(124, 92, 255, .9); animation: boom-text 2.2s cubic-bezier(.2, 1.4, .4, 1) forwards; }
    .boom .bt b { display: block; font-size: 24px; line-height: 1.2; }
    .boom .bt span { display: block; margin-top: 6px; font-size: 15px; font-family: var(--font-body); font-weight: 800; }
    @keyframes boom-life { 0%, 85% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes boom-flash { from { opacity: 1; transform: scale(.3); } to { opacity: 0; transform: scale(2.2); } }
    @keyframes boom-ring { from { transform: scale(.2); opacity: 1; } to { transform: scale(22); opacity: 0; } }
    @keyframes boom-text { 0% { transform: scale(.3); opacity: 0; } 30% { transform: scale(1.12); opacity: 1; } 45% { transform: scale(1); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sheet-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes item-in { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes buy-pop { 0% { transform: scale(1); } 35% { transform: scale(1.045); box-shadow: 0 0 0 3px var(--accent), 0 0 26px rgba(255, 200, 61, .6); } 100% { transform: scale(1); } }
    @keyframes score-bump { 40% { transform: scale(1.12); filter: brightness(1.3); } }
    @keyframes coin-swap { 0% { transform: rotateY(0) scale(1); } 50% { transform: rotateY(90deg) scale(.8); } 100% { transform: rotateY(0) scale(1); } }
    @keyframes ripple { from { transform: scale(.6); opacity: .7; } to { transform: scale(1.7); opacity: 0; } }
    .list.enter > * { animation: item-in .38s cubic-bezier(.2, .9, .3, 1) both; animation-delay: calc(var(--i, 0) * 28ms); }
    .item.pop, .tile.pop { animation: buy-pop .55s ease-out; }
    #score.bump { animation: score-bump .35s ease-out; }
    #coin.swap { animation: coin-swap .5s ease-in-out; }
    .ripple { position: fixed; z-index: 7; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 2px solid currentColor; pointer-events: none; animation: ripple .55s ease-out forwards; }
    .tab.has-badge:not(.active) .badge { animation: badge-pulse 1.6s ease-in-out infinite; }
    @keyframes badge-pulse { 50% { transform: scale(1.35); } }
    .bosschip { border: none; cursor: pointer; color: #fff; font: inherit; font-size: 12px; font-weight: 800; background: linear-gradient(135deg, #ef4444, #f97316); animation: banner-pulse 1.2s ease-in-out infinite; }
    .bosschip[hidden] { display: none; }
    .bosschip svg { width: 15px; height: 15px; }
    .bosschip.fight { animation: none; background: linear-gradient(90deg, #16a34a var(--p, 0%), #7f1d1d var(--p, 0%)); }
    #stage.boss #coin { filter: drop-shadow(0 0 22px #ef4444) saturate(1.3); }
    .target { position: absolute; inset: -7%; border-radius: 50%; border: 4px solid rgba(255, 255, 255, .9); box-shadow: 0 0 14px rgba(255, 255, 255, .7); pointer-events: none; opacity: 0; transform: scale(1.7); }
    .target[hidden] { display: none; }
    .target.on { opacity: 1; animation: target-shrink 1.5s linear forwards; }
    .target.hot { border-color: #3ddc97; box-shadow: 0 0 20px #3ddc97, inset 0 0 14px rgba(61, 220, 151, .5); }
    @keyframes target-shrink { to { transform: scale(.88); } }
    @media (prefers-reduced-motion: reduce) {
      .target.on { animation: none; transform: scale(1); }
      .boom, .boom::before, .boom i, .boom .bt, .list.enter > *, .item.pop, .tile.pop, #score.bump, #coin.swap, .ripple, .rbchip, .tab.has-badge:not(.active) .badge { animation: none; }
      .boom { opacity: 1; }
    }
    @media (min-width: 760px) and (min-aspect-ratio: 1/1) {
      .modal { align-items: center; }
      .mcard { border-radius: 24px; border-bottom: 1px solid var(--line); max-height: 80vh; }
    }
  </style>
</head>
<body>
  <div id="sky"></div>
  <div id="toast" role="status"></div>
  <div class="modal" id="modal" hidden>
    <div class="mcard" role="dialog" aria-modal="true">
      <button class="mclose" id="mclose" type="button" aria-label="Закрыть">×</button>
      <div id="mbody"></div>
    </div>
  </div>
  <main id="main">
    <header class="hud">
      <div class="league" id="league" role="button" tabindex="0" aria-label="Топ игроков">
        <span class="emblem" id="emblem"></span>
        <div class="lg-info">
          <div class="lg-name"><span id="lg-name" style="color:var(--text);font-size:13px;font-weight:800"></span><span id="lg-pct"></span></div>
          <i class="meter"><b id="lg-bar"></b></i>
        </div>
      </div>
      <button class="world-pill" id="world-pill" aria-label="Миры">
        <span class="dot" id="world-dot"></span><span id="world-name"></span><b id="world-mult"></b>
      </button>
      <span class="gems-chip"><span id="gem-icon"></span><b id="gems">0</b></span>
    </header>
    <div class="score-box">
      <div class="score-line"><span id="score-ic"></span><div id="score">0</div></div>
      <div class="stats">
        <span class="chip"><span id="ic-click"></span><b id="per-click" class="pos">1</b> за клик</span>
        <span class="chip"><span id="ic-sec"></span><b id="per-sec" class="pos">0</b> в секунду</span>
        <span class="chip buff" id="buff" hidden></span>
        <span class="chip buff" id="turbo" hidden></span>
        <button class="chip rbchip" id="rb-banner" type="button" hidden></button>
        <button class="chip bosschip" id="boss-chip" type="button" hidden></button>
      </div>
    </div>
    <div class="coin-wrap">
      <div id="scene"></div>
      <div id="fx"></div>
      <div class="coin-holder">
        <div class="coin-stage" id="stage">
          <div class="halo"></div><div class="ring"></div><i class="target" id="target" hidden></i>
          <button id="coin" aria-label="Кликнуть по монетке"></button>
        </div>
        <i class="combo" id="combo"><b id="combo-bar"></b></i>
        <div class="skills" id="skills"></div>
        <div class="kbd-hint">Пробел — клик · Q W E — навыки · цифры — разделы</div>
      </div>
    </div>
    <section class="panel">
      <div class="sheet-head"><h2 id="sheet-title"></h2><span id="sheet-sub"></span></div>
      <div class="list" id="list"></div>
    </section>
    <nav class="tabs" aria-label="Разделы">
      <button class="tab active" data-tab="home" aria-label="Монета"><span class="ti"></span><span class="tl">Тап</span></button>
      <button class="tab" data-tab="upgrades" aria-label="Прокачка"><span class="ti"></span><span class="tl">Прокачка</span><i class="badge"></i></button>
      <button class="tab" data-tab="skins" aria-label="Скины"><span class="ti"></span><span class="tl">Скины</span></button>
      <button class="tab" data-tab="worlds" aria-label="Миры"><span class="ti"></span><span class="tl">Миры</span></button>
      <button class="tab" data-tab="rebirth" aria-label="Перерождение"><span class="ti"></span><span class="tl">Престиж</span><i class="badge"></i></button>
      <button class="tab" data-tab="rewards" aria-label="Награды"><span class="ti"></span><span class="tl">Награды</span><i class="badge"></i></button>
      <button class="tab" data-tab="top" aria-label="Топ игроков"><span class="ti"></span><span class="tl">Топ</span></button>
    </nav>
  </main>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    // Season 2 lives under its own key: a cached older copy of the page keeps reading and writing "state" and can no longer
    // strip the season mark from (and so reset) the new save.
    const STORAGE_KEY = "s2", OLD_KEY = "state";

    const svg = (body) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
    const ICONS = {

      heritage: svg('<path d="M12 2.5l8 3v6.5c0 5-3.4 8.2-8 9.5-4.6-1.3-8-4.5-8-9.5V5.5z"/><path d="M9 12l2 2 4-4"/>'),

    Object.assign(ICONS, {

    ICONS.haste = ICONS.power;
    const COIN = '<svg class="cur" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#ffd23f" stroke="#d99000" stroke-width="1.4"/><circle cx="8" cy="8" r="3.6" fill="none" stroke="#d99000" stroke-width="1.2"/></svg>';

    // Coin upgrades are reset by a rebirth (a share of the levels is kept). `inc` = base income per second per level.

    const gen = (id, name, inc, base, grad) => ({
      id, group: "Доход", name, inc, base, growth: id === "auto" ? 1.6 : 1.5, grad, always: id === "auto",

    const UPGRADES = [
      { id: "power", group: "Клик", always: true, name: "Сила клика", base: 10, growth: 1.5, grad: ["#ffa24a", "#ff5a36"], desc: () => "+1 монета за клик" },

      gen("factory", "Фабрика", 280, 60000, ["#ffb36b", "#d9531e"]),
      gen("bank", "Банк", 2000, 8e5, ["#7ee0b5", "#0f8f6a"]),
      gen("portal", "Портал", 15000, 1.2e7, ["#b69cff", "#5b34d6"]),
      gen("reactor", "Реактор", 120000, 2e8, ["#6ee7ff", "#0a6fb8"]),
      { id: "mult", group: "Усиления", always: true, name: "Множитель", base: 200, growth: 1.8, grad: ["#c58bff", "#7c3aed"],

      { id: "fever", group: "Усиления", name: "Долгая лихорадка", base: 1500, growth: 1.7, max: 10, grad: ["#ffc46b", "#e8590c"],
        desc: (l) => `Лихорадка длится ${15 + 3 * l} с${l < 10 ? ` → ${18 + 3 * l} с` : ""}` },

    const GENS = UPGRADES.filter((u) => u.inc);
    const GROUPS = ["Клик", "Доход", "Усиления"];

    // Permanent upgrades bought with gems; they survive rebirths.
    const PERMS = [
      { id: "gold",     name: "Золотая жила",      base: 1, growth: 2, grad: ["#ffd23f", "#f59e0b"],

    // A rebirth is bought with the coins earned in the run: 1 млн for the first, x32 for every next one. Rebirths never stack,
    // one at a time. Each one makes all upgrades 16x pricier but multiplies the whole income for good.
    const REBIRTH_BASE = 1e6, REBIRTH_STEP = 32, PRICE_STEP = 16, REBIRTH_INCOME = 4;
    const rebirthCost = (n = state.rebirths) => REBIRTH_BASE * Math.pow(REBIRTH_STEP, n) * (1 - Math.min(0.4, tal("rbcost")));
    const rebirthReady = () => state.earned >= rebirthCost();
    const rebirthGems = () => Math.round((3 + state.rebirths) * gemBoost());
    const rebirthMult = (n = state.rebirths) => Math.pow(REBIRTH_INCOME, n);
    const priceMult = (n = state.rebirths) => Math.pow(PRICE_STEP, n);
    const keepShare = () => Math.min(0.6, 0.1 + 0.05 * state.perm.heritage);    // share of upgrade levels kept by a rebirth
    const startCoins = () => 200 * state.perm.start;
    function addCoins(n) { state.score += n; state.earned += n; state.total += n; state.quests.p.earn += n; }
    const buffActive = () => Date.now() < buff.until;
    const frenzyOn = () => Date.now() < frenzyUntil;
    const baseIncome = () => GENS.reduce((sum, u) => sum + u.inc * state.lv[u.id], 0);
    const incomeMult = () => multiplier() * (1 + perk("income") + pet("income") + tal("income"));
    const perSec = () => Math.round(baseIncome() * incomeMult());
    const perClick = () =>
      Math.round((1 + state.lv.power + skinById(state.skin).bonus + state.lv.fingers * 0.01 * baseIncome()) *
        multiplier() * (1 + 0.25 * state.perm.cpower + perk("click") + pet("click") + tal("click")) * (buffActive() ? buff.mult : 1) * (frenzyOn() ? 2 : 1));
    const critChance = () => CRIT_CHANCE + 0.01 * state.lv.crit + perk("crit") + pet("crit") + tal("crit");
    const critMult = () => CRIT_MULT + 0.5 * state.lv.critp + perk("critp") + tal("critp");
    const goldenGap = () => (45000 + Math.random() * 75000) * (1 - 0.06 * state.lv.luck) * (1 - Math.min(0.8, perk("golden") + pet("golden") + tal("golden")));
    const feverMs = () => 15000 + 3000 * state.lv.fever + perk("fever");
    const offlineRate = () => 0.5 + 0.1 * state.perm.night + perk("offline") + pet("offline") + tal("offline");
    const offlineCap = () => (3 + state.perm.night) * 3600;

    function leagueInfo() {
      let i = 0;
      while (i < LEAGUES.length - 1 && state.total >= LEAGUES[i + 1].at) i++;
      const cur = LEAGUES[i], next = LEAGUES[i + 1];
      return { i, cur, next, pct: next ? (state.total - cur.at) / (next.at - cur.at) : 1 };
    }

    // Telegram CloudStorage keeps progress per user across devices;
    // localStorage is the fallback when opened outside Telegram.
    const cloud = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")
      ? tg.CloudStorage : null;

    let saveBlocked = false; // the cloud could not be read and nothing is stored locally: never overwrite real progress with a blank game
    function readCloud(key, tries = 3) {
      return new Promise((resolve) => {
        const attempt = (n) => cloud.getItem(key, (err, v) => {
          if (!err) resolve({ ok: true, value: v || "" });
          else if (n >= tries) resolve({ ok: false, value: "" });
          else setTimeout(() => attempt(n + 1), 500 * n);
        });
        attempt(1);
      });
    }
    const readLocal = (key) => { try { return localStorage.getItem(key) || ""; } catch { return ""; } };
    const stampOf = (raw) => { try { const j = JSON.parse(raw); return { season: Number(j.season), seen: Number(j.lastSeen) || 0 }; } catch { return null; } };

    // Picks the newest save of the current season from the cloud, the local mirror and the old key.
    async function readSave() {
      let cloudRaw = "", cloudOk = true;
      if (cloud) {
        const r = await readCloud(STORAGE_KEY);
        cloudOk = r.ok;
        cloudRaw = r.value;
        if (r.ok && !cloudRaw) { const old = await readCloud(OLD_KEY, 2); cloudRaw = old.value; }
      }
      const cands = [cloudRaw, readLocal(STORAGE_KEY), readLocal(OLD_KEY)].filter(Boolean)
        .map((raw) => ({ raw, st: stampOf(raw) })).filter((c) => c.st);
      const cur = cands.filter((c) => c.st.season === SEASON).sort((a, b) => b.st.seen - a.st.seen)[0];
      saveBlocked = !!cloud && !cloudOk && !cur;
      return (cur || cands[0] || { raw: "" }).raw;
    }

    async function load() { return parseState(await readSave()); }

    function parseState(raw) {
      const next = defaultState();
      if (raw) {
        try {
          const s = JSON.parse(raw);
          if (Number(s.season) !== SEASON) { // a new season: progress is dropped, only the settings stay
            const keep = s.settings || {};
            next.settings = { sound: keep.sound !== false, haptic: keep.haptic !== false, manager: true, collector: true, top: keep.top !== false };
            seasonReset = !!(Number(s.clicks) > 0 || Number(s.total) > 0);
            return next;
          }
          const clean = (v) => { const n = Number(v); return Number.isFinite(n) && n > 0 ? n : 0; };
          const whole = (v) => Math.floor(clean(v));
          next.score = clean(s.score);
          next.gems = whole(s.gems);
          next.rebirths = whole(s.rebirths);
          next.earned = Math.max(clean(s.earned), next.score);
          for (const u of UPGRADES) next.lv[u.id] = Math.min(u.max || Infinity, whole(s.lv && s.lv[u.id]));
          for (const u of PERMS) next.perm[u.id] = Math.min(u.max || Infinity, whole(s.perm && s.perm[u.id]));
          const owned = (typeof s.owned === "string" && s.sk !== 2 ? unpackSet(SKIN_ORDER_V1.map((id) => ({ id })), s.owned) : idsOf(s.owned, SKINS)).filter((id) => SKINS.some((x) => x.id === id));
          next.owned = Array.from(new Set(["classic", ...owned]));
          next.skin = next.owned.includes(s.skin) ? s.skin : "classic";
          const worlds = idsOf(s.worlds, WORLDS).filter((id) => WORLDS.some((x) => x.id === id));
          next.worlds = Array.from(new Set(["meadow", ...worlds]));
          next.world = next.worlds.includes(s.world) ? s.world : "meadow";
          next.wmax = Math.max(whole(s.wmax), next.worlds.length);
          // worlds open strictly in order, so worlds lost to the short-lived version 2.1 reset are restored from the lifetime counter
          if (next.worlds.length < next.wmax) next.worlds = WORLDS.slice(0, Math.min(next.wmax, WORLDS.length)).map((w) => w.id);
          next.talents = Object.fromEntries(TALENTS.filter((t) => whole(s.talents && s.talents[t.id]) > 0).map((t) => [t.id, Math.min(TALENT_MAX, whole(s.talents[t.id]))]));
          next.pets = Object.fromEntries(PETS.filter((p) => whole(s.pets && s.pets[p.id]) > 0).map((p) => [p.id, Math.min(PET_MAX, whole(s.pets[p.id]))]));
          next.bosses = whole(s.bosses);
          next.perfects = whole(s.perfects);
          next.clicks = whole(s.clicks);
          next.golden = whole(s.golden);
          next.total = Math.max(clean(s.total), next.earned);
          next.claimed = idsOf(s.claimed, ACHS).filter((id) => ACHS.some((a) => a.id === id));
          next.lastSeen = clean(s.lastSeen);
          const d = s.daily || {};
          next.daily = { last: typeof d.last === "string" ? d.last : "", streak: whole(d.streak) };
          next.turbo = clean(s.turbo);
          next.wheel = typeof s.wheel === "string" ? s.wheel : "";
          const q = s.quests || {};
          next.quests = {
            day: typeof q.day === "string" ? q.day : "",
            p: Object.fromEntries(Object.keys(next.quests.p).map((k) => [k, whole(q.p && q.p[k])])),
            t: { earn: whole(q.t && q.t.earn) },
            done: Array.isArray(q.done) ? q.done.filter((id) => QUESTS.some((x) => x.id === id)) : [],
          };
          const st = s.settings || {};
          next.settings = { sound: st.sound !== false, haptic: st.haptic !== false, manager: st.manager !== false, collector: st.collector !== false, top: st.top !== false };
          next.chest = clean(s.chest);
          next.frenzies = whole(s.frenzies);
          next.chests = whole(s.chests);
          next.surge = clean(s.surge);
          next.haste = clean(s.haste);
          next.cd = { surge: clean(s.cd && s.cd.surge), meteor: clean(s.cd && s.cd.meteor), haste: clean(s.cd && s.cd.haste) };
          const ex = s.exp || {};
          next.exp = { until: clean(ex.until), kind: Math.min(2, whole(ex.kind)) };
          next.exps = whole(s.exps);
          next.rbNote = Number.isFinite(Number(s.rbNote)) ? Math.floor(Number(s.rbNote)) : -1;
          next.avatar = Math.min(AVATARS.length - 1, whole(s.avatar));
          next.avs = Array.isArray(s.avs) ? [...new Set(s.avs.map(Number).filter((i) => AVATARS[i] && AVATARS[i].kind === "gem"))] : [];
          next.promos = Array.isArray(s.promos) ? s.promos.filter((c) => typeof c === "string" && PROMOS[c]) : [];
          next.seenVer = typeof s.seenVer === "string" ? s.seenVer.slice(0, 8) : "";
          next.hints = Array.isArray(s.hints) ? s.hints.filter((h) => typeof h === "string" && h.length <= 20).slice(0, 20) : [];
        } catch {}
      }
      return next;
    }

    // Lists of owned skins / opened worlds / claimed awards are saved as hex bitmasks over the (append-only!) data arrays:
    // the full id lists alone would not fit into the 4096 characters CloudStorage allows.
    const packSet = (list, ids) => {
      const have = new Set(ids), bits = list.map((x) => (have.has(x.id) ? 1 : 0));
      let out = "";
      for (let i = 0; i < bits.length; i += 4) out += (bits[i] * 8 + (bits[i + 1] || 0) * 4 + (bits[i + 2] || 0) * 2 + (bits[i + 3] || 0)).toString(16);
      return out;
    };
    const unpackSet = (list, hex) => list.filter((_, i) => {
      const d = parseInt(String(hex)[i >> 2] || "0", 16) || 0;
      return (d >> (3 - (i & 3))) & 1;
    }).map((x) => x.id);
    const idsOf = (raw, list) => (typeof raw === "string" ? unpackSet(list, raw) : Array.isArray(raw) ? raw : []);

    function writeNow() {
      if (saveBlocked) return;
      state.lastSeen = Date.now();
      const json = JSON.stringify({ ...state, sk: 2, owned: packSet(SKINS, state.owned), worlds: packSet(WORLDS, state.worlds), claimed: packSet(ACHS, state.claimed) });
      if (cloud) cloud.setItem(STORAGE_KEY, json, () => {});
      try { localStorage.setItem(STORAGE_KEY, json); } catch {} // a local mirror next to the cloud copy
    }

    // Writes at most once per 1.5 s while playing; purchases and leaving the app save at once (flush).
    function save() {
      if (saveTimer) return;
      saveTimer = setTimeout(() => { saveTimer = null; writeNow(); }, 1500);
    }

    function flush() {
      if (!ready) return;
      clearTimeout(saveTimer);
      saveTimer = null;
      writeNow();
    }

    function applySkin() {
      const s = skinById(state.skin);
      coin.innerHTML = `<span class="g">${s.glyph}</span>`;
      coin.style.background = skinFace(s);
      coin.style.borderRadius = skinShape(s);
      coin.style.boxShadow = `0 0 0 10px ${s.rim} inset, 0 0 0 14px ${s.rim2} inset, 0 12px 40px rgba(${s.glow}, .35)`;
      coin.style.color = s.ink;
      coin.style.textShadow = `0 2px 0 ${s.hi}`;
      stageEl.style.setProperty("--glow", s.glow);
      stageEl.style.setProperty("--shape", skinShape(s));
      const fx = [].concat(s.fx || []);
      FX_CLASSES.forEach((c) => coin.classList.toggle(c, fx.includes(c)));
    }

    const worldGrad = (w) => `linear-gradient(135deg, ${w.grad[0]}, ${w.grad[1]})`;

    function applyWorld() {
      const w = worldById(state.world);
      skyEl.style.background =
        `radial-gradient(130% 60% at 50% 0%, rgba(${w.sky}, .3), transparent 70%), ` +
        `linear-gradient(to top, rgba(${w.sky}, .12), transparent 60%)`;
      sceneEl.innerHTML = `<svg viewBox="0 0 400 120" preserveAspectRatio="none">
        ${w.extra || ""}
        <path d="${w.back}" fill="${w.ground}" opacity=".35"/>
        <path d="${w.front}" fill="${w.ground}" opacity=".65"/></svg>`;
      let dots = "";
      for (let i = 0; i < 18; i++) {
        const d = FX_SPEED[w.fx] * (1 + Math.random());
        const vars = `--s:${(2 + Math.random() * 4).toFixed(1)}px; --d:${d.toFixed(2)}s; --dl:-${(Math.random() * d).toFixed(2)}s`;
        if (w.fx === "swirl") {
          const a = Math.random() * Math.PI * 2, r = 90 + Math.random() * 150;
          dots += `<i style="left:50%; top:50%; --tx:${(Math.cos(a) * r).toFixed(0)}px; --ty:${(Math.sin(a) * r * 0.6).toFixed(0)}px; ${vars}"></i>`;
        } else {
          dots += `<i style="left:${(Math.random() * 100).toFixed(1)}%; top:${(Math.random() * 100).toFixed(1)}%; ${vars}"></i>`;
        }
      }
      fxEl.className = "fx-" + w.fx;
      fxEl.innerHTML = dots;
      document.getElementById("world-dot").style.background = worldGrad(w);
      document.getElementById("world-dot").innerHTML = ICONS[w.id];
      document.getElementById("world-name").textContent = w.name;
      document.getElementById("world-mult").textContent = `×${xs(w.mult)}`;
      [skyEl, sceneEl, fxEl].forEach((el) => {
        el.classList.remove("world-enter");
        void el.offsetWidth; // restart the fade-in
        el.classList.add("world-enter");
      });
    }

    function skinIconStyle(s) {
      return `background: ${skinFace(s)}; border-radius: ${skinShape(s)}; ` +
             `box-shadow: 0 0 0 3px ${s.rim} inset; color: ${s.ink};`;
    }

    function itemHTML({ act, name, desc, price, cost, cur, disabled, cls, lead, cta }) {
      return `
        <button class="item${cls ? " " + cls : ""}" data-act="${act}"
                ${cost != null ? `data-cost="${cost}" data-cur="${cur}"` : ""} ${disabled ? "disabled" : ""}>
          ${lead}
          <span class="info">
            <div class="name">${name}</div>
            <div class="desc">${desc}</div>
          </span>
          <span class="price${cost == null && !cta ? " free" : ""}">${price}</span>
        </button>`;
    }

    const iconTile = (id, grad) =>
      `<span class="icon" style="background: linear-gradient(135deg, ${grad[0]}, ${grad[1]})">${ICONS[id]}</span>`;
    const LOCK = ICONS.lock.replace("<svg", '<svg class="cur"');

    function worldItem(w, i) {
      const prev = WORLDS[i - 1];
      const item = { act: `world:${w.id}`, lead: iconTile(w.id, w.grad), name: w.name, desc: `Доход ×${xs(w.mult)} · ${w.perkText}`, cur: "coin" };
      if (state.world === w.id) return { ...item, cls: "equipped", disabled: true, price: "Вы здесь" };
      if (state.worlds.includes(w.id)) return { ...item, price: "Перейти" };
      if (prev && !state.worlds.includes(prev.id))
        return { ...item, disabled: true, price: LOCK, desc: `${item.desc}. Сначала открой «${prev.name}»` };
      if (state.rebirths < w.rebirths)
        return { ...item, disabled: true, price: `${LOCK} ${w.rebirths}`,
                 desc: `${item.desc}. Нужно перерождений: ${w.rebirths} (есть ${state.rebirths})` };
      return { ...item, price: `${COIN} ${fmt(w.cost)}`, cost: w.cost };
    }

    function skinTile(s) {
      const owned = state.owned.includes(s.id);
      const equipped = state.skin === s.id;
      const trophyReady = !!s.trophy && state.bosses >= s.trophy;
      const locked = !owned && (s.promo || (s.trophy && !trophyReady));
      const price = equipped ? "Надето" : owned ? "Надеть" : s.promo ? "Промокод" : s.trophy ? (trophyReady ? "Забрать" : `Боссы ${state.bosses}/${s.trophy}`) : s.gem ? `${GEM} ${s.gem}` : `${COIN} ${s.cost >= 1e6 ? short(s.cost) : fmt(s.cost)}`;
      return `
        <button class="tile${equipped ? " equipped" : ""}" data-act="skin:${s.id}" style="--rar:${RARITY[s.r].c}"
                ${owned || locked || s.trophy ? "" : `data-cost="${s.gem || s.cost}" data-cur="${s.gem ? "gem" : "coin"}"`} ${equipped || locked ? "disabled" : ""}>
          <span class="skin-icon" style="${skinIconStyle(s)}">${s.glyph}</span>
          <span class="t-name${s.name.length > 10 ? " long" : ""}">${s.name}</span>
          <span class="t-bonus">${s.bonus ? `+${s.bonus >= 1e6 ? short(s.bonus) : fmt(s.bonus)} к клику` : "Без бонуса"}</span>
          <span class="price${owned ? " free" : ""}">${price}</span>
        </button>`;
    }

    const canBuyUpgrade = () => UPGRADES.some((u) => upgradeVisible(u) && !isMax(u) && upgradeCost(u) <= state.score);
    const upgradeVisible = (u) => u.always || state.lv[u.id] > 0 || state.total >= u.base * 0.4;

    function upgradeItem(u) {
      const l = state.lv[u.id];
      const max = isMax(u);
      return itemHTML({
        act: `up:${u.id}`, cls: max ? "maxed" : "", disabled: max, lead: iconTile(u.id, u.grad),
        name: `${u.name} <span class="lv">ур. ${l}${u.max ? ` / ${u.max}` : ""}</span>`, desc: u.desc(l),
        price: max ? "МАКС" : `${COIN} ${fmt(upgradeCost(u))}`, cost: max ? null : upgradeCost(u), cur: "coin",
      });
    }

    function rebirthCard() {
      const pct = Math.round(keepShare() * 100);
      const n = state.rebirths;
      return `
        <div class="pcard">
          <div class="p-top">
            <div class="p-gain"><span class="p-label">Награда за перерождение</span><b>+<span id="rb-gain"></span>${GEM}</b></div>
            <div class="p-stat">Кристаллов: <b id="rb-gems"></b><br>Перерождений: <b id="rb-count"></b></div>
          </div>
          <i class="meter"><b id="rb-bar" style="--c1:#7c5cff;--c2:#ff4f9a"></b></i>
          <div class="desc" id="rb-next"></div>
          <div class="keep-row">Получишь:
            <span class="pill keep">Весь доход ×${xs(REBIRTH_INCOME)} навсегда (сейчас ×${xs(rebirthMult())}, будет ×${xs(rebirthMult(n + 1))})</span></div>
          <div class="keep-row">Останется:
            <span class="pill keep">Скины</span><span class="pill keep">Миры</span><span class="pill keep">Кристаллы</span>
            <span class="pill keep">Награды</span><span class="pill keep">Постоянные улучшения</span>
            <span class="pill keep">${pct}% уровней улучшений</span></div>
          <div class="keep-row">Сбросится:
            <span class="pill lose">Монеты</span><span class="pill lose">${100 - pct}% уровней улучшений</span>
            <span class="pill lose">Цены улучшений ×${PRICE_STEP} (сейчас ×${xs(priceMult())}, будут ×${xs(priceMult(n + 1))})</span></div>
          <div class="keep-row">Следующее перерождение будет стоить ${fmt(rebirthCost(n + 1))} монет за забег (в ${REBIRTH_STEP} раз дороже).</div>
          <button class="rebirth-btn" id="rb-btn" data-act="rebirth"></button>
        </div>`;
    }

    function sheetSub() {
      if (tab === "upgrades") return `Множитель дохода ×${multiplier().toFixed(2).replace(/\.?0+$/, "")}`;
      if (tab === "skins") return `${state.owned.length} из ${SKINS.length}${collection() ? ` · коллекции +${Math.round(collection() * 100)}%` : ""}`;
      if (tab === "worlds") return `${state.worlds.length} из ${WORLDS.length} открыто`;
      if (tab === "rebirth") return `Перерождений: ${fmt(state.rebirths)} · следующее за ${fmt(rebirthCost())}`;
      if (tab === "rewards") return `${state.claimed.length} из ${ACHS.length} достижений`;
      if (tab === "top") return topState.status === "ok" ? `${topState.rows.length} лучших` : "";
      return "";
    }

    function statsCard() {
      const rows = [
        ["Кликов", fmt(state.clicks)], ["Монет за всё время", state.total >= 1e6 ? short(state.total) : fmt(state.total)],
        ["Перерождений", fmt(state.rebirths)], ["Доход от перерождений", `×${xs(rebirthMult())}`],
        ["Лига", leagueInfo().cur.n], ["Цены улучшений", `×${xs(priceMult())}`], ["Версия", `${VERSION}, сезон ${SEASON}`],
        ["Золотых монет поймано", fmt(state.golden)], ["Бешенств", fmt(state.frenzies)],
        ["Сундуков открыто", fmt(state.chests)], ["Достижений", `${state.claimed.length} из ${ACHS.length}`],
        ["Скинов", `${state.owned.length} из ${SKINS.length}`], ["Миров сейчас", `${state.worlds.length} из ${WORLDS.length}`],
        ["Боссов побеждено", fmt(state.bosses)], ["Точных ударов", fmt(state.perfects)],
      ];
      return `<div class="statgrid">${rows.map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("")}</div>`;
    }

    function chestItem() {
      const left = state.chest - Date.now();
      const ready = left <= 0;
      return itemHTML({
        act: "chest", cta: ready, disabled: !ready, lead: iconTile("chest", ["#ffb347", "#b45309"]), name: "Сундук",
        desc: "Раз в 4 часа: доход за полчаса и шанс на кристалл",
        price: ready ? "Открыть" : `${Math.floor(left / 3.6e6)} ч ${Math.ceil((left % 3.6e6) / 6e4)} мин`,
      });
    }

    function wheelCard() {
      const spun = state.wheel === dayKey();
      const bg = WHEEL.map((w, i) => `${w.c} ${i * 45}deg ${(i + 1) * 45}deg`).join(", ");
      const labels = WHEEL.map((w, i) => `<span style="transform: rotate(${i * 45 + 22.5}deg)"><b>${w.html}</b></span>`).join("");
      return `
        <div class="wheel-card">
          <div class="wheel-box"><i class="pointer"></i>
            <div class="wheel noanim" id="wheel" style="background: conic-gradient(${bg}); transform: rotate(${wheelAngle}deg)">${labels}</div></div>
          <div class="wheel-side">
            <div class="name">Колесо фортуны</div>
            <div class="desc">Одно бесплатное вращение в день: монеты, кристаллы, турбо или золотая монета.</div>
            <button class="spin-btn" data-act="spin" ${spun ? "disabled" : ""}>${spun ? "Приходи завтра" : "Крутить"}</button>
          </div>
        </div>`;
    }

    function questItem(q) {
      const t = questTarget(q), v = Math.min(state.quests.p[q.key], t);
      const done = state.quests.done.includes(q.id), ready = !done && v >= t;
      return itemHTML({
        act: `quest:${q.id}`, cta: ready, disabled: !ready, lead: iconTile(q.icon, q.grad), name: q.name,
        desc: `${q.desc(t)}<i class="bar"><b style="width:${(v / t * 100).toFixed(1)}%"></b></i><span class="pg">${fmt(v)} / ${fmt(t)}</span>`,
        price: done ? "Получено" : `${GEM} ${ready ? "+" : ""}${q.gems}`,
      });
    }

    function settingItem(id, name, desc) {
      const on = state.settings[id];
      return itemHTML({ act: `set:${id}`, cta: on, lead: iconTile(id, ["#8aa0b0", "#4b6070"]), name, desc, price: on ? "Вкл" : "Выкл" });
    }

    function renderList(force) {
      if (spinning && tab === "rewards" && !force) return; // keep the wheel from jumping while it turns
      rebirthArmed = false;
      clearTimeout(armTimer);
      document.getElementById("sheet-title").textContent = TAB_TITLES[tab] || "";
      document.getElementById("sheet-sub").textContent = sheetSub();
      if (tab === "home") {
        listEl.innerHTML = "";
        return;
      }
      if (tab === "top") {
        listEl.innerHTML = topView();
        return;
      }
      if (tab === "upgrades") {
        const hidden = UPGRADES.some((u) => !upgradeVisible(u));
        listEl.innerHTML = (state.perm.manager ? settingItem("manager", "Менеджер", "Сам покупает доходные улучшения, можно выключить") : "") + GROUPS.map((g) => {
          const items = UPGRADES.filter((u) => u.group === g && upgradeVisible(u));
          return items.length ? `<div class="section">${g}</div>${items.map(upgradeItem).join("")}` : "";
        }).join("") + (hidden ? '<div class="more">Новые улучшения откроются, когда заработаешь больше.</div>' : "");
      } else if (tab === "skins") {
        listEl.innerHTML = RARITY.map((r, i) => {
          const group = SKINS.filter((x) => x.r === i).sort((x, y) => x.cost - y.cost);
          const have = group.filter((x) => state.owned.includes(x.id)).length;
          return group.length
            ? `<div class="section" style="--rar:${r.c}"><i class="rar"></i>${r.n}
                 <span class="sec-n${have === group.length ? " done" : ""}">${have} из ${group.length}${have === group.length ? " · +5% к доходу" : ""}</span></div>
               <div class="grid">${group.map(skinTile).join("")}</div>`
            : "";
        }).join("");
      } else if (tab === "worlds") {
        listEl.innerHTML = WORLDS.map((w, i) => itemHTML(worldItem(w, i))).join("");
      } else if (tab === "rewards") {
        const d = dailyInfo();
        const status = (a) => (state.claimed.includes(a.id) ? 2 : a.val() >= a.target ? 0 : 1);
        const rank = [...ACHS].sort((x, y) => status(x) - status(y) || y.val() / y.target - x.val() / x.target);
        const av = AVATARS[state.avatar];
        const quick = `<div class="qrow">
          <button class="qbtn" data-act="modal:profile"><span class="qi" style="background:linear-gradient(135deg,${av.g[0]},${av.g[1]})">${av.e}</span>Профиль</button>
          <button class="qbtn" data-act="modal:pets"><span class="qi" style="background:linear-gradient(135deg,#f9a8d4,#a855f7)">🐾</span>Питомцы</button>
          <button class="qbtn" data-act="modal:talents"><span class="qi" style="background:linear-gradient(135deg,#fde047,#ea580c)">🎓</span>Таланты</button>
          <button class="qbtn" data-act="modal:promo"><span class="qi" style="background:linear-gradient(135deg,#ffd23f,#f59e0b)">${ICONS.gift}</span>Промокод</button>
          <button class="qbtn${state.seenVer !== VERSION ? " new" : ""}" data-act="modal:log"><span class="qi" style="background:linear-gradient(135deg,#4ea4f6,#7c3aed)">${ICONS.star}</span>Новое</button></div>`;
        listEl.innerHTML = quick + itemHTML({
          act: "daily", cta: true, disabled: !d.claimable, lead: iconTile("gift", ACH_GRAD.mult),
          name: `Ежедневный подарок <span class="lv">серия ${d.streak}</span>`,
          desc: `+${fmt(d.coins)} монет${d.gems ? ` и ${d.gems} кристалла` : ""} · каждый 7-й день +3 кристалла`,
          price: d.claimable ? "Забрать" : "Завтра",
        }) + chestItem() + expCard() + wheelCard() + `<div class="section">Задания дня · ${state.quests.done.length} из ${QUESTS.length}</div>` +
          QUESTS.map(questItem).join("") + `<div class="section">Достижения · ${state.claimed.length} из ${ACHS.length}</div>` + rank.map((a) => {
          const v = Math.min(a.val(), a.target);
          const st = status(a);
          return itemHTML({
            act: `ach:${a.id}`, cta: st === 0, disabled: st !== 0, lead: iconTile(a.icon, a.grad), name: a.name,
            desc: `${a.desc}<i class="bar"><b style="width:${(v / a.target * 100).toFixed(1)}%"></b></i><span class="pg">${fmt(v)} / ${fmt(a.target)}</span>`,
            price: st === 2 ? "Получено" : `${GEM} ${st === 0 ? "+" : ""}${a.gems}`,
          });
        }).join("") + '<div class="section">Статистика</div>' + statsCard() + '<div class="section">Настройки</div>' +
          settingItem("sound", "Звук", "Тихие эффекты кликов, покупок и золотых монет") +
          settingItem("haptic", "Вибрация", "Отклик при кликах и покупках в Telegram") +
          (state.perm.manager ? settingItem("manager", "Менеджер", "Автопокупка доходных улучшений") : "") +
          (state.perm.collector ? settingItem("collector", "Сборщик", "Сам ловит золотые монеты") : "") +
          settingItem("top", "Показывать меня в топе", "Твоё имя из Telegram и общий счёт видят все игроки") +
          itemHTML({ act: "reset", lead: iconTile("cycle", ["#f87171", "#b91c1c"]), name: "Сбросить прогресс",
