            desc: resetArmed ? "Это удалит всё, включая кристаллы и скины. Нажми ещё раз" : "Начать игру заново, настройки останутся",
            price: resetArmed ? "Точно?" : "Сбросить", cls: resetArmed ? "danger" : "" }) +
          itemHTML({ act: "share", cta: true, lead: iconTile("share", ["#4ea4f6", "#2563eb"]), name: "Пригласить друзей", desc: "Отправить ссылку на игру в Telegram", price: "Поделиться" });
      } else {
        listEl.innerHTML = rebirthCard() + '<div class="section">Бусты за кристаллы</div>' + BOOSTS.map((b) => itemHTML({
          act: `boost:${b.id}`, lead: iconTile(b.icon, b.grad), name: b.name, desc: b.desc(),
          price: `${GEM} ${b.cost}`, cost: b.cost, cur: "gem",
        })).join("") + '<div class="section">Постоянные улучшения за кристаллы</div>' + PERMS.map((u) => {
          const lvl = state.perm[u.id];
          const maxed = lvl >= (u.max || Infinity);
          if (lvl >= 1 && (u.id === "manager" || u.id === "collector")) { // bought: this row is the on/off switch
            const on = state.settings[u.id];
            return itemHTML({
              act: `set:${u.id}`, cta: on, lead: iconTile(u.id, u.grad),
              name: `${u.name} <span class="lv">ур. ${lvl} / ${u.max}</span>`,
              desc: `${u.desc(lvl)} · ${on ? "включён, нажми, чтобы выключить" : "выключен, нажми, чтобы включить"}`,
              price: on ? "Вкл" : "Выкл",
            });
          }
          return itemHTML({
            act: `perm:${u.id}`, cls: maxed ? "maxed" : "", disabled: maxed, lead: iconTile(u.id, u.grad),
            name: `${u.name} <span class="lv">ур. ${lvl}${u.max ? ` / ${u.max}` : ""}</span>`, desc: u.desc(lvl),
            price: maxed ? "МАКС" : `${GEM} ${fmt(permCost(u))}`,
            cost: maxed ? null : permCost(u), cur: "gem",
          });
        }).join("");
      }
      updateRebirthCard();
      refreshAfford();
    }

    function refreshAfford() {
      listEl.querySelectorAll("[data-cost]").forEach((el) => {
        const have = el.dataset.cur === "gem" ? state.gems : state.score;
        el.disabled = have < Number(el.dataset.cost);
      });
    }

    function updateRebirthCard() {
      const btn = document.getElementById("rb-btn");
      if (!btn) return;
      const cost = rebirthCost(), g = rebirthGems(), ok = state.earned >= cost;
      document.getElementById("rb-gain").textContent = fmt(g);
      document.getElementById("rb-count").textContent = fmt(state.rebirths);
      document.getElementById("rb-gems").textContent = fmt(state.gems);
      document.getElementById("rb-bar").style.width = Math.min(100, Math.max(0, state.earned / cost * 100)).toFixed(1) + "%";
      document.getElementById("rb-next").textContent = ok
        ? `Заработано в этом забеге: ${fmt(state.earned)}. Перерождение доступно!`
        : `Нужно заработать за забег ${fmt(cost)} монет, есть ${fmt(state.earned)}. Осталось ${fmt(Math.ceil(cost - state.earned))}.`;
      btn.disabled = !ok;
      btn.classList.toggle("armed", rebirthArmed && ok);
      if (!ok) btn.textContent = `Нужно заработать ещё ${fmt(Math.ceil(cost - state.earned))} монет`;
      else if (rebirthArmed) btn.textContent = `Точно? Нажми ещё раз (+${fmt(g)} кристаллов)`;
      else btn.innerHTML = `Переродиться: +${fmt(g)} ${GEM}, доход ×${xs(REBIRTH_INCOME)}`;
    }

    function renderLeague() {
      const L = leagueInfo();
      if (L.i !== shownLeague) {
        if (ready && shownLeague >= 0 && L.i > shownLeague) { toast(`Новая лига: ${L.cur.n}`); haptic("success"); }
        shownLeague = L.i;
        leagueEl.style.setProperty("--c1", L.cur.c[0]);
        leagueEl.style.setProperty("--c2", L.cur.c[1]);
        emblemEl.innerHTML = `${ICONS.shield}<b style="font-size:${L.i >= 99 ? 8 : L.i >= 9 ? 10 : 11}px">${L.i + 1}</b>`;
        document.getElementById("lg-name").textContent = L.cur.n;
      }
      document.getElementById("lg-pct").textContent = L.next ? `${Math.floor(L.pct * 100)}%` : "Максимум";
      document.getElementById("lg-bar").style.width = (L.pct * 100).toFixed(1) + "%";
    }

    function renderStats() {
      scoreEl.textContent = fmt(state.score);
      scoreEl.toggleAttribute("data-long", scoreEl.textContent.length > 9);
      perClickEl.textContent = fmt(perClick());
      perSecEl.textContent = fmt(perSec());
      gemsEl.textContent = fmt(state.gems);
      ensureQuests();
      const left = Math.ceil((buff.until - Date.now()) / 1000);
      buffEl.hidden = left <= 0;
      if (left > 0) buffEl.innerHTML = `${ICONS.bolt}<b>×${buff.mult}</b> клики · ${left} с`;
      const tl = Math.ceil((state.turbo - Date.now()) / 1000);
      turboEl.hidden = tl <= 0;
      if (tl > 0) turboEl.innerHTML = `${ICONS.mult}<b>×3</b> доход · ${tl} с`;
      if (ready && tab === "home") {
        if (canBuyUpgrade()) hint("buy", "Хватает на улучшение: загляни в «Прокачку»");
        else if (rebirthReady() && state.rebirths === 0) hint("prestige", "Перерождение доступно: загляни в «Престиж»");
        else if (tgUser && state.total >= 1000) hint("top", "Нажми на лигу вверху или на «Топ», чтобы увидеть рейтинг");
      }
      renderLeague();
      renderSkills();
      refreshAfford();
      updateRebirthCard();
      const sig = ready ? claimable().join(",") : "";
      document.querySelector('.tab[data-tab="rewards"]').classList.toggle("has-badge", sig !== "");
      document.querySelector('.tab[data-tab="upgrades"]').classList.toggle("has-badge", ready && canBuyUpgrade());
      document.querySelector('.tab[data-tab="rebirth"]').classList.toggle("has-badge", ready && rebirthReady());
      checkRebirthNote();
      if (sig !== rewardSig) {
        if (tab !== "rewards") rewardSig = sig;
        else if (!pressing) { rewardSig = sig; keepScroll(renderList); } // not under a pressed finger: the tap would be lost
      }
    }

    function keepScroll(fn) {
      const top = listEl.scrollTop;
      fn();
      listEl.scrollTop = top;
    }

    // small animations
    function pop(act) {
      const el = listEl.querySelector(`[data-act="${act}"]`);
      if (!el || calm.matches) return;
      el.classList.remove("pop");
      void el.offsetWidth;
      el.classList.add("pop");
      setTimeout(() => el.classList.remove("pop"), 650);
    }
    let enterTimer = null, retryAt = 0;
    function enterAnim() {
      if (calm.matches) return;
      [...listEl.children].slice(0, 16).forEach((el, i) => el.style.setProperty("--i", i));
      listEl.classList.add("enter");
      clearTimeout(enterTimer);
      enterTimer = setTimeout(() => listEl.classList.remove("enter"), 900);
    }
    function bump() {
      if (calm.matches) return;
      scoreEl.classList.remove("bump");
      void scoreEl.offsetWidth;
      scoreEl.classList.add("bump");
    }
    function ripple(x, y) {
      if (calm.matches || document.querySelectorAll(".ripple").length > 4) return;
      const el = document.createElement("i");
      el.className = "ripple";
      el.style.left = x + "px";
      el.style.top = y + "px";
      el.style.color = `rgb(${skinById(state.skin).glow})`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 600);
    }
    function celebrate() {
      const r = coin.getBoundingClientRect();
      burst(r.left + r.width / 2 || innerWidth / 2, r.top + r.height / 2 || innerHeight / 2, true);
      bump();
    }

    function haptic(kind) {
      if (state.settings.sound) (SFX[kind] || SFX.tap)();
      if (!state.settings.haptic || !tg || !tg.HapticFeedback) return;
      if (kind === "success" || kind === "gold" || kind === "rebirth") tg.HapticFeedback.notificationOccurred("success");
      else if (kind === "crit") tg.HapticFeedback.impactOccurred("heavy");
      else tg.HapticFeedback.impactOccurred("light");
    }

    function showPlus(x, y, amount, crit) {
      const el = document.createElement("div");
      el.className = crit ? "plus crit" : "plus";
      el.textContent = "+" + fmt(amount);
      el.style.left = x + "px";
      el.style.top = y + "px";
      document.body.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }

    // a handful of sparks in the colour of the equipped skin
    function burst(x, y, crit) {
      if (calm.matches || !coin.animate || document.querySelectorAll(".spark").length > 60) return;
      const rgb = skinById(state.skin).glow;
      for (let i = 0; i < (crit ? 10 : 4); i++) {
        const el = document.createElement("i");
        el.className = "spark";
        el.style.left = x + "px";
        el.style.top = y + "px";
        el.style.background = el.style.color = `rgb(${rgb})`;
        document.body.appendChild(el);
        const a = Math.random() * Math.PI * 2;
        const d = 28 + Math.random() * (crit ? 90 : 50);
        el.animate([
          { transform: "translate(-50%, -50%) scale(1)", opacity: 1 },
          { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d}px)) scale(.2)`, opacity: 0 },
        ], { duration: 450 + Math.random() * 250, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => el.remove();
      }
    }

    function buyUpgrade(id) {
      const u = UPGRADES.find((x) => x.id === id);
      if (!u || isMax(u)) return;
      const cost = upgradeCost(u);
      if (state.score < cost) return;
      state.score -= cost;
      state.lv[id] += 1;
      state.quests.p.buys += 1;
      haptic("success");
      renderStats();
      keepScroll(renderList);
      pop("up:" + id);
      flush();
    }

    function buyPerm(id) {
      const u = PERMS.find((x) => x.id === id);
      if (!u || state.perm[id] >= (u.max || Infinity)) return;
      const cost = permCost(u);
      if (state.gems < cost) return;
      state.gems -= cost;
      state.perm[id] += 1;
      haptic("success");
      renderStats();
      keepScroll(renderList);
      pop("perm:" + id);
      flush();
    }

    // The manager buys the cheapest affordable income upgrade, a few per second at most.
    function autoBuy() {
      if (!state.perm.manager || !state.settings.manager) return false;
      let bought = false;
      for (let n = 0; n < 5; n++) {
        let best = null, bestCost = Infinity;
        for (const u of GENS) {
          const c = upgradeCost(u);
          if (!isMax(u) && c <= state.score && c < bestCost) { best = u; bestCost = c; }
        }
        if (!best) break;
        state.score -= bestCost;
        state.lv[best.id] += 1;
        bought = true;
      }
      return bought;
    }

    // The rebirth is announced once when it becomes affordable: a toast, a sound, a buzz and a banner that stays until used.
    const bannerEl = document.getElementById("rb-banner");
    function checkRebirthNote() {
      const ok = ready && rebirthReady();
      bannerEl.hidden = !(ok && tab !== "rebirth");
      if (!ok) return;
      bannerEl.innerHTML = `${ICONS.cycle}<span>Перерождение: +${fmt(rebirthGems())} ${GEM}</span>`;
      if (state.rbNote === state.rebirths) return;
      state.rbNote = state.rebirths;
      toast("Можно переродиться! Загляни в «Престиж»");
      haptic("rebirth");
      save();
    }
    bannerEl.addEventListener("click", () => setTab("rebirth"));

    function ceremony(n, g, mult) {
      const el = document.createElement("div");
      el.className = "boom";
      el.innerHTML = `<i></i><i></i><i></i><div class="bt"><b>Перерождение ${n}</b><span>+${fmt(g)} ${GEM} · доход ×${xs(mult)}</span></div>`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    // Takes the rebirth (the caller checked rebirthReady): gems for it, income ×4, upgrade prices ×16, part of the levels stays.
    function doRebirth() {
      const g = rebirthGems(), keep = keepShare();
      state.gems += g;
      state.rebirths += 1;
      state.score = startCoins();
      state.earned = 0;
      for (const id of Object.keys(state.lv)) state.lv[id] = Math.floor(state.lv[id] * keep);
      rebirthArmed = false;
      clearTimeout(armTimer);
      return g;
    }

    function rebirth() {
      if (!rebirthReady()) return;
      if (!rebirthArmed) {
        rebirthArmed = true;
        armTimer = setTimeout(() => { rebirthArmed = false; updateRebirthCard(); }, 3000);
        updateRebirthCard();
        return;
      }
      const g = doRebirth();
      haptic("rebirth");
      ceremony(state.rebirths, g, rebirthMult());
      toast(`Перерождение ${state.rebirths}: +${fmt(g)} кристаллов, осталось ${Math.round(keepShare() * 100)}% уровней`);
      applySkin();
      applyWorld();
      renderStats();
      renderList();
      flush();
    }

    function useSkin(id) {
      const s = skinById(id);
      if (!state.owned.includes(s.id)) {
        if (s.promo) return;
        if (s.trophy) { if (state.bosses < s.trophy) return; }
        else if (s.gem) { if (state.gems < s.gem) return; state.gems -= s.gem; }
        else { if (state.score < s.cost) return; state.score -= s.cost; }
        state.owned.push(s.id);
      }
      state.skin = s.id;
      haptic("success");
      applySkin();
      coin.classList.remove("swap"); void coin.offsetWidth; if (!calm.matches) coin.classList.add("swap");
      renderStats();
      keepScroll(renderList);
      pop("skin:" + s.id);
      flush();
    }

    const dayKey = (t = Date.now()) => new Date(t).toLocaleDateString("sv");
    function dailyInfo() {
      const claimable = state.daily.last !== dayKey();
      const streak = !claimable ? state.daily.streak
        : state.daily.last === dayKey(Date.now() - 864e5) ? state.daily.streak + 1 : 1;
      const coins = Math.round(Math.max(500, perSec() * 900) * Math.min(streak, 7));
      return { claimable, streak, coins, gems: streak % 7 === 0 ? 3 : 0 };
    }
    // ids of rewards that can be collected right now
    const claimable = () => [
      ...(dailyInfo().claimable ? ["daily"] : []),
      ...(TALENTS.some((t) => (state.talents[t.id] || 0) < TALENT_MAX && TALENT_COST[state.talents[t.id] || 0] <= talentPoints()) ? ["tal"] : []),
      ...(state.wheel !== dayKey() ? ["wheel"] : []),
      ...(state.chest <= Date.now() ? ["chest"] : []),
      ...(state.exp.until && state.exp.until <= Date.now() ? ["exp"] : []),
      ...QUESTS.filter((q) => !state.quests.done.includes(q.id) && state.quests.p[q.key] >= questTarget(q)).map((q) => "q:" + q.id),
      ...ACHS.filter((a) => !state.claimed.includes(a.id) && a.val() >= a.target).map((a) => a.id),
    ];

    // One-time tips for new players, each shown once (saved in state.hints).
    function hint(id, text) {
      if (state.hints.includes(id) || toastEl.classList.contains("show")) return; // never covers a real message; tries again later
      state.hints.push(id);
      toast(text);
      save();
    }

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3200);
    }

    function claimAch(id) {
      const a = ACHS.find((x) => x.id === id);
      if (!a || state.claimed.includes(id) || a.val() < a.target) return;
      state.claimed.push(id);
      state.gems += a.gems;
      toast(`«${a.name}»: +${a.gems} кристаллов`);
      haptic("success");
      celebrate();
      renderStats();
      keepScroll(renderList);
      flush();
    }

    const topHeaders = () => ({ apikey: TOP.key, Authorization: `Bearer ${TOP.key}`, "Content-Type": "application/json" });
    const topOn = () => !!tgUser && state.settings.top && TOP.url.startsWith("https://");

    // Sends the score at most once a minute and only when it changed (or when forced).
    function submitScore(force) {
      if (!ready || !topOn() || state.total < 100) return Promise.resolve(); // no empty rows for brand-new players
      const now = Date.now();
      if (!force && (now - lastSubmit < 60000 || state.total === lastSentTotal)) return Promise.resolve();
      lastSubmit = now;
      lastSentTotal = state.total;
      const name = [tgUser.first_name, tgUser.username].find((x) => x) || "Игрок";
      return fetch(`${TOP.url}/rest/v1/rpc/submit_score`, {
        method: "POST", headers: topHeaders(),
        body: JSON.stringify({ p_id: tgUser.id, p_name: String(name).slice(0, 24), p_total: state.total, p_rebirths: state.rebirths, p_league: leagueInfo().i, p_skin: state.skin, p_avatar: state.avatar, p_season: SEASON }),
      }).then((r) => (r.ok ? r.json() : null)).then((j) => {
        const row = Array.isArray(j) ? j[0] : j;
        if (row && row.rank != null) topState.me = { rank: Number(row.rank), players: Number(row.players) };
      }).catch(() => {});
    }

    function leaveTop() {
      topState.me = null;
      if (!tgUser || !TOP.url.startsWith("https://")) return;
      fetch(`${TOP.url}/rest/v1/rpc/leave_top`, { method: "POST", headers: topHeaders(), body: JSON.stringify({ p_id: tgUser.id }) }).catch(() => {});
    }

    function loadTop() {
      topState.status = "loading";
      if (tab === "top") keepScroll(() => renderList(true));
      const order = topState.sort === "rebirths" ? "rebirths.desc,total.desc" : "total.desc,tg_id.asc";
      const done = () => { if (tab === "top") keepScroll(() => renderList(true)); };
      submitScore(true).then(() =>
        fetch(`${TOP.url}/rest/v1/leaderboard?select=tg_id,name,total,rebirths,league,avatar&order=${order}&limit=50`, { headers: topHeaders() }))
        .then((r) => { if (!r || !r.ok) throw new Error("bad response"); return r.json(); })
        .then((rows) => { topState.rows = Array.isArray(rows) ? rows : []; topState.status = "ok"; topLoadedAt = Date.now(); done(); })
        .catch(() => { topState.status = "error"; done(); });
    }

    function topView() {
      const sort = (id, label) => `<button class="chipbtn${topState.sort === id ? " on" : ""}" data-act="topsort:${id}">${label}</button>`;
      let body;
      if (topState.status === "loading" || topState.status === "idle") body = '<div class="tstate">Загружаю топ…</div>';
      else if (topState.status === "error") body = '<div class="tstate">Не удалось загрузить топ. Проверь соединение.<button data-act="toprefresh">Повторить</button></div>';
      else if (!topState.rows.length) body = '<div class="tstate">В топе пока никого. Будь первым: зайди из Telegram и играй.</div>';
      else {
        body = topState.rows.map((r, i) => {
          const L = LEAGUES[Math.min(LEAGUES.length - 1, Math.max(0, Number(r.league) || 0))];
          const mine = tgUser && Number(r.tg_id) === Number(tgUser.id);
          const val = topState.sort === "rebirths" ? `${fmt(r.rebirths)} пер.` : (r.total >= 1e6 ? short(r.total) : fmt(r.total));
          const av = AVATARS[Math.min(AVATARS.length - 1, Math.max(0, Number(r.avatar) || 0))];
          return `<div class="trow r${i + 1}${mine ? " me" : ""}"><span class="rk">${i + 1}</span>
            <span class="av sm" style="background:linear-gradient(135deg,${av.g[0]},${av.g[1]})">${av.e}</span>
            <span class="emblem sm" style="--c1:${L.c[0]};--c2:${L.c[1]}">${ICONS.shield}<b style="font-size:${LEAGUES.indexOf(L) >= 99 ? 7 : 9}px">${LEAGUES.indexOf(L) + 1}</b></span>
            <span class="tn"><b>${esc(r.name)}${mine ? " (ты)" : ""}</b><i>${L.n}</i></span><span class="tv">${val}</span></div>`;
        }).join("");
      }
      let me;
      if (!tgUser) me = '<div class="tme"><b>Только для Telegram</b><span>Открой игру в Telegram, чтобы попасть в топ. Смотреть рейтинг можно и отсюда.</span></div>';
      else if (!state.settings.top) me = '<div class="tme"><b>Ты скрыт из топа</b><span>Включи «Показывать меня в топе» в настройках раздела «Награды».</span></div>';
      else if (state.total < 100) me = '<div class="tme"><b>Заработай 100 монет</b><span>После этого ты появишься в рейтинге.</span></div>';
      else if (topState.me) me = `<div class="tme"><b>Твоё место: ${fmt(topState.me.rank)}</b><span>из ${fmt(topState.me.players)} ${topState.me.players % 10 === 1 && topState.me.players % 100 !== 11 ? "игрока" : "игроков"} · всего монет: ${state.total >= 1e6 ? short(state.total) : fmt(state.total)}</span></div>`;
      else me = '<div class="tme"><b>Считаем твоё место…</b><span>Рейтинг обновляется раз в минуту.</span></div>';
      return `<div class="tsort">${sort("total", "По монетам")}${sort("rebirths", "По перерождениям")}</div>${me}${body}`;
    }

    function useSkill(id) {
      const sk = SKILLS.find((x) => x.id === id), now = Date.now();
      if (!ready || !sk || state.total < sk.need || state.cd[id] > now) return;
      state.cd[id] = now + sk.cd * Math.max(0.5, 1 - 0.05 * state.perm.skillcd) * 1000;
      if (id === "surge") { state.surge = now + 15000; toast("Поток: весь доход ×3 на 15 секунд"); }
      else if (id === "haste") { state.haste = now + 8000; toast("Ускорение: 10 кликов в секунду на 8 секунд"); }
      else {
        const gain = Math.round(Math.max(perSec() * 600, perClick() * 300, 500));
        addCoins(gain);
        const r = coin.getBoundingClientRect();
        if (r.width) { showPlus(r.left + r.width / 2, r.top + r.height * 0.3, gain, true); burst(r.left + r.width / 2, r.top + r.height / 2, true); }
        toast(`Метеор: +${fmt(gain)} монет`);
      }
      haptic("gold");
      renderStats();
      setTimeout(renderStats, 15100);
      flush();
    }

    function renderSkills() {
      const now = Date.now();
      for (const sk of SKILLS) {
        const b = document.getElementById("skill-" + sk.id);
        const open = ready && state.total >= sk.need;
        b.hidden = !open;
        if (!open) continue;
        const left = Math.ceil((state.cd[sk.id] - now) / 1000);
        b.classList.toggle("cooling", left > 0);
        b.classList.toggle("on", (sk.id === "surge" && surgeOn()) || (sk.id === "haste" && now < state.haste));
        b.querySelector(".cd").textContent = left > 0 ? (left >= 60 ? Math.ceil(left / 60) + " м" : left) : "";
      }
    }

    function expCard() {
      const e = state.exp, now = Date.now();
      if (e.until) {
        const x = EXPS[e.kind], left = e.until - now, ready = left <= 0;
        const pct = Math.max(0, Math.min(100, (1 - left / (x.h * 3.6e6)) * 100));
        return itemHTML({
          act: "expclaim", cta: ready, disabled: !ready, lead: iconTile("exp", ["#4ade80", "#047857"]), name: `Экспедиция · ${x.h} ч`,
          desc: ready ? `Отряд вернулся: +${fmt(expCoins(x))} монет${x.gems ? ` и ${x.gems} ${x.gems === 1 ? "кристалл" : "кристалла"}` : ""}` : `Отряд в пути<i class="bar"><b style="width:${pct.toFixed(1)}%"></b></i>`,
          price: ready ? "Забрать" : hm(left),
        });
      }
      return `<div class="exp-card"><div class="name">Экспедиция</div>
        <div class="desc">Отряд приносит доход за время пути с бонусом (до ×10) и кристаллы. Отправить можно одну за раз.</div>
        <div class="exp-btns">${EXPS.map((x, i) => `<button data-act="exp:${i}">${x.h} ч${x.gems ? ` · ${GEM}${x.gems}` : ""}</button>`).join("")}</div></div>`;
    }

    function startExp(i) {
      if (state.exp.until || !EXPS[i]) return;
      state.exp = { until: Date.now() + EXPS[i].h * 3.6e6, kind: i };
      toast(`Экспедиция отправлена на ${EXPS[i].h} ч`);
      haptic("success");
      renderStats();
      keepScroll(() => renderList(true));
      flush();
    }

    function claimExp() {
      const e = state.exp;
      if (!e.until || Date.now() < e.until) return;
      const x = EXPS[e.kind], coins = expCoins(x);
      addCoins(coins);
      state.gems += x.gems;
      state.exp = { until: 0, kind: 0 };
      state.exps += 1;
      toast(`Экспедиция: +${fmt(coins)} монет${x.gems ? ` и ${x.gems} ${x.gems === 1 ? "кристалл" : "кристалла"}` : ""}`);
      haptic("success");
      renderStats();
      keepScroll(() => renderList(true));
      flush();
    }

    function claimChest() {
      if (Date.now() < state.chest) return;
      state.chest = Date.now() + 4 * 3600e3;
      state.chests += 1;
      const coins = wheelCoins(30);
      addCoins(coins);
      const gem = Math.random() < 0.4;
      if (gem) state.gems += 1;
      toast(`Сундук: +${fmt(coins)} монет${gem ? " и 1 кристалл" : ""}`);
      haptic("success");
      renderStats();
      keepScroll(renderList);
      flush();
    }

    function claimQuest(id) {
      const q = QUESTS.find((x) => x.id === id);
      ensureQuests();
      if (!q || state.quests.done.includes(id) || state.quests.p[q.key] < questTarget(q)) return;
      state.quests.done.push(id);
      state.gems += q.gems;
      toast(`«${q.name}»: +${q.gems} ${q.gems === 1 ? "кристалл" : "кристалла"}`);
      haptic("success");
      renderStats();
      keepScroll(renderList);
      flush();
    }

    function buyBoost(id) {
      const b = BOOSTS.find((x) => x.id === id);
      if (!b || state.gems < b.cost) return;
      if (id === "rain" && goldenEl) { toast("Золотая монета уже летит, лови её"); return; }
      state.gems -= b.cost;
      if (id === "turbo") {
        state.turbo = Math.max(Date.now(), state.turbo) + 120000;
        toast("Турбо: весь доход ×3 на 2 минуты");
      } else if (id === "rain") {
        spawnGolden();
        toast("Золотая монета вылетела");
      } else if (id === "loot") {
        openLoot();
      } else if (id === "egg") {
        toast("Яйцо: " + givePet(rollPet()));
        celebrate();
      } else {
        const gain = cashAmount();
        addCoins(gain);
        toast(`Касса: +${fmt(gain)} монет`);
      }
      haptic("success");
      renderStats();
      keepScroll(renderList);
      flush();
    }

    function applyPrize(p) {
      if (p.kind === "coins") {
        const gain = wheelCoins(p.min);
        addCoins(gain);
        toast(`Колесо: +${fmt(gain)} монет`);
      } else if (p.kind === "gems") {
        state.gems += p.n;
        toast(`Колесо: +${p.n} ${p.n === 1 ? "кристалл" : p.n < 5 ? "кристалла" : "кристаллов"}`);
      } else if (p.kind === "turbo") {
        state.turbo = Math.max(Date.now(), state.turbo) + 120000;
        toast("Колесо: турбо ×3 на 2 минуты");
      } else {
        if (!goldenEl) spawnGolden();
        toast("Колесо: золотая монета");
      }
      haptic("gold");
    }

    function spin() {
      if (spinning || state.wheel === dayKey()) return;
      state.wheel = dayKey();
      const total = WHEEL.reduce((sum, w) => sum + w.w, 0);
      let r = Math.random() * total, i = 0;
      while (i < WHEEL.length - 1 && (r -= WHEEL[i].w) >= 0) i++;
      wheelAngle = (Math.floor(wheelAngle / 360) + 6) * 360 - (i * 45 + 22.5 + (Math.random() - 0.5) * 30);
      spinning = true;
      const el = document.getElementById("wheel");
      if (el) { el.classList.remove("noanim"); el.style.transform = `rotate(${wheelAngle}deg)`; }
      const btn = listEl.querySelector('[data-act="spin"]');
      if (btn) btn.disabled = true;
      SFX.spin();
      setTimeout(() => {
        spinning = false;
        applyPrize(WHEEL[i]);
        renderStats();
        keepScroll(() => renderList(true));
        flush();
      }, 3500);
    }

    function share() {
      const text = "Заходи в Coin Clicker: копи монеты, открывай миры и скины!";
      const url = `https://t.me/share/url?url=${encodeURIComponent(location.href.split("#")[0])}&text=${encodeURIComponent(text)}`;
      if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
      else window.open(url, "_blank", "noopener");
    }

    let resetArmed = false, resetTimer = null;
    function resetGame() {
      if (!resetArmed) {
        resetArmed = true;
        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => { resetArmed = false; if (tab === "rewards") keepScroll(() => renderList(true)); }, 4000);
        keepScroll(() => renderList(true));
        return;
      }
      resetArmed = false;
      clearTimeout(resetTimer);
      leaveTop(); // the old score must not stay in the top
      const settings = state.settings;
      state = defaultState();
      state.settings = settings;
      state.seenVer = VERSION;
      boss = null; stageEl.classList.remove("boss"); endTarget();
      buff = { until: 0, mult: 1 }; frenzyUntil = 0; combo = 0; wheelAngle = 0;
      shownLeague = -1; lastSubmit = 0; lastSentTotal = -1; topState.me = null; topState.status = "idle";
      today = dayKey();
      ensureQuests();
      applySkin();
      applyWorld();
      toast("Прогресс сброшен. Начинаем заново");
      flush();
      renderStats();
      setTab("home");
    }

    function toggleSetting(id) {
      state.settings[id] = !state.settings[id];
      if (id === "top") { if (state.settings.top) submitScore(true); else leaveTop(); }
      if (id === "sound" && state.settings.sound) SFX.success();
      renderStats();
      keepScroll(renderList);
      flush();
    }

    function claimDaily() {
      const d = dailyInfo();
      if (!d.claimable) return;
      state.daily = { last: dayKey(), streak: d.streak };
      addCoins(d.coins);
      state.gems += d.gems;
      toast(`Подарок дня: +${fmt(d.coins)} монет${d.gems ? ` и ${d.gems} кристалла` : ""}`);
      haptic("success");
      celebrate();
      renderStats();
      keepScroll(renderList);
      flush();
    }

    // A golden coin drifts across the screen now and then: tap it for a lump sum or a click boost.
    function spawnGolden() {
      if (goldenEl) return;
      const el = document.createElement("button");
      el.className = "golden";
      el.setAttribute("aria-label", "Золотая монета");
      el.style.setProperty("--y", 14 + Math.random() * 40 + "%");
      el.addEventListener("animationend", (e) => {
        if (e.animationName === "cross") { el.remove(); goldenEl = null; }
      });
      el.addEventListener("pointerdown", (e) => { e.preventDefault(); catchGolden(e.clientX, e.clientY); });
      document.body.appendChild(el);
      goldenEl = el;
      hint("gold", "Золотая монета! Нажми на неё, пока она летит");
      if (state.perm.collector && state.settings.collector) {
        setTimeout(() => {
          if (goldenEl !== el) return;
          const r = el.getBoundingClientRect();
          catchGolden(r.left + r.width / 2, r.top + r.height / 2);
        }, 2000);
      }
    }

    function catchGolden(x, y) {
      if (!goldenEl) return;
      goldenEl.remove();
      goldenEl = null;
      state.golden += 1;
      state.quests.p.golden += 1;
      if (Math.random() < 0.5) {
        const lump = Math.round(Math.max(perSec() * 300, perClick() * 100) * (1 + perk("lump")));
        addCoins(lump);
        showPlus(x, y, lump, true);
        toast(`Золотая монета: куш +${fmt(lump)}`);
      } else {
        buff = { until: Date.now() + feverMs(), mult: 7 };
        toast(`Золотая лихорадка: клики ×7 на ${feverMs() / 1000} секунд`);
      }
      haptic("gold");
      renderStats();
      flush();
    }

    function useWorld(id) {
      const i = WORLDS.findIndex((w) => w.id === id);
      const w = WORLDS[i];
      if (!w) return;
      if (!state.worlds.includes(w.id)) {
        if (i > 0 && !state.worlds.includes(WORLDS[i - 1].id)) return;
        if (state.rebirths < w.rebirths || state.score < w.cost) return;
        state.score -= w.cost;
        state.worlds.push(w.id);
        state.wmax = Math.max(state.wmax, state.worlds.length);
      }
      state.world = w.id;
      haptic("success");
      applyWorld();
      renderStats();
      keepScroll(renderList);
      pop("world:" + w.id);
      flush();
    }

    function renderCombo() {
      const bar = document.getElementById("combo-bar");
      if (!frenzyOn()) bar.style.width = Math.min(100, combo / COMBO_NEED * 100) + "%";
    }

    // Tapping fast fills the bar; a full bar starts a short frenzy with double click income.
    function tickCombo() {
      const now = Date.now();
      combo = now - comboAt < COMBO_GAP ? combo + 1 : 1;
      comboAt = now;
      clearTimeout(comboTimer);
      comboTimer = setTimeout(() => { combo = 0; renderCombo(); }, COMBO_GAP);
      if (!frenzyOn() && combo >= COMBO_NEED) {
        combo = 0;
        frenzyUntil = now + FRENZY_MS;
        state.frenzies += 1;
        const box = document.getElementById("combo"), bar = document.getElementById("combo-bar");
        box.classList.add("frenzy");
        bar.style.transition = "none"; bar.style.width = "100%"; void bar.offsetWidth;
        bar.style.transition = `width ${FRENZY_MS}ms linear`; bar.style.width = "0%";
        toast("Бешенство: клики ×2 на 6 секунд");
        haptic("gold");
        setTimeout(() => { box.classList.remove("frenzy"); bar.style.transition = ""; renderCombo(); renderStats(); }, FRENZY_MS + 50);
      } else renderCombo();
    }

    // ---- boss: now and then a boss shows up; hit the coin enough times within 12 seconds to beat it ----
    const BOSS_MS = 30000, BOSS_WAIT = 25000;
    let boss = null, nextBoss = Date.now() + 150000 + Math.random() * 120000;
    const bossEl = document.getElementById("boss-chip");
    const bossNeed = () => Math.round((200 + 20 * Math.min(state.bosses, 25)) * (1 - Math.min(0.5, tal("boss"))));
    const bossMs = () => BOSS_MS + 1000 * tal("bosstime");
    const bossReward = () => Math.round(Math.max(perSec() * 3600, perClick() * 750, 9000) * (1 + 0.1 * Math.min(state.bosses, 30)));
    function endBoss(msg, wait) {
      boss = null;
      nextBoss = Date.now() + wait;
      stageEl.classList.remove("boss");
      if (msg) toast(msg);
      renderBoss();
    }
    function renderBoss() {
      if (!boss) { bossEl.hidden = true; bossEl.classList.remove("fight"); return; }
      const now = Date.now();
      if (now > boss.until) { endBoss(boss.phase === "wait" ? "Босс ушёл" : "Не успел: босс ушёл", 240000); return; }
      bossEl.hidden = false;
      if (boss.phase === "wait") {
        bossEl.classList.remove("fight");
        bossEl.innerHTML = `${ICONS.bolt}<span>Босс! Нажми и сразись</span>`;
      } else {
        bossEl.classList.add("fight");
        bossEl.style.setProperty("--p", Math.min(100, boss.hits / boss.need * 100).toFixed(0) + "%");
        bossEl.innerHTML = `<span>Босс: ${boss.hits} из ${boss.need} · ${Math.ceil((boss.until - now) / 1000)} с</span>`;
      }
    }
    function startBoss() {
      if (!boss || boss.phase !== "wait") return;
      boss = { phase: "fight", until: Date.now() + bossMs(), hits: 0, need: bossNeed() };
      stageEl.classList.add("boss");
      toast(`Босс! Нажми на монету ${boss.need} раз за ${bossMs() / 1000} секунд`);
      haptic("crit");
      renderBoss();
    }
    function winBoss() {
      const coins = bossReward(), gems = 2 + (state.bosses % 5 === 4 ? 3 : 0);
      addCoins(coins);
      state.gems += gems;
      state.bosses += 1;
      state.quests.p.boss += 1;
      const drop = Math.random() < 0.4 + tal("petdrop") ? " · " + givePet(rollPet()) : "";
      endBoss(`Босс побеждён: +${fmt(coins)} монет и ${gems} ${gems < 5 ? "кристалла" : "кристаллов"}${drop}`, 360000 + Math.random() * 180000);
      if (tab === "skins") keepScroll(renderList);
      haptic("success");
      celebrate();
      renderStats();
      flush();
    }
    bossEl.addEventListener("pointerdown", (e) => { e.preventDefault(); startBoss(); });

    // ---- precise hit: a ring shrinks around the coin, tap while it is green for a big bonus ----
    let target = null, targetTimer = null, nextTarget = Date.now() + 12000;
    const targetEl = document.getElementById("target");
    const HOT_FROM = 1150, HOT_TO = 1500, hotFrom = () => HOT_FROM - tal("aim");
    function endTarget() {
      target = null;
      clearTimeout(targetTimer);
      targetEl.hidden = true;
      targetEl.classList.remove("on", "hot");
    }
    function spawnTarget() {
      endTarget();
      target = { at: Date.now() };
      targetEl.hidden = false;
      void targetEl.offsetWidth;
      targetEl.classList.add("on");
      const mine = target;
      setTimeout(() => { if (target === mine) targetEl.classList.add("hot"); }, hotFrom());
      targetTimer = setTimeout(() => { if (target === mine) endTarget(); }, HOT_TO + 80);
    }
    let perfectChain = 0, lastPerfect = 0;
    function perfect(x, y) {
      const now = Date.now();
      perfectChain = now - lastPerfect < 25000 ? Math.min(5, perfectChain + 1) : 1; // precise hits in a row raise the bonus up to x5
      lastPerfect = now;
      const gain = Math.round(perClick() * 8 * perfectChain);
      if (perfectChain >= 3) toast(`Серия точных ударов ×${perfectChain}`);
      addCoins(gain);
      state.perfects += 1;
      state.quests.p.perfect += 1;
      showPlus(x, y, gain, true);
      ripple(x, y);
      burst(x, y, true);
      bump();
      haptic("gold");
      endTarget();
    }

    // ---- pets ----
    function rollPet() {
      let r = Math.random() * PETS.reduce((n, p) => n + PET_RARITY[p.r].w, 0);
      for (const p of PETS) { r -= PET_RARITY[p.r].w; if (r < 0) return p; }
      return PETS[0];
    }
    // gives a pet (or a level of it) and returns the text for the toast
    function givePet(p) {
      const lv = state.pets[p.id] || 0;
      if (lv >= PET_MAX) { state.gems += 2; return `${p.e} ${p.name} уже на максимуме: +2 кристалла`; }
      state.pets[p.id] = lv + 1;
      return lv ? `${p.e} ${p.name}: уровень ${lv + 1}` : `новый питомец ${p.e} ${p.name}!`;
    }

    // ---- crystal chest: the gem sink with a random prize ----
    function openLoot() {
      const skins = SKINS.filter((x) => !x.gem && !x.promo && x.r <= 3 && !state.owned.includes(x.id));
      const avs = AVATARS.map((_, i) => i).filter((i) => AVATARS[i].kind === "gem" && !state.avs.includes(i));
      const table = [["coins", 34], ["gems", 20], ["turbo", 14], ["golden", 10], ["skin", skins.length ? 16 : 0], ["avatar", avs.length ? 6 : 0], ["pet", 14]];
      let r = Math.random() * table.reduce((n, t) => n + t[1], 0), kind = "coins";
      for (const [k, w] of table) { if (r < w) { kind = k; break; } r -= w; }
      if (kind === "golden" && goldenEl) kind = "coins";
      if (kind === "coins") { const g = wheelCoins(90); addCoins(g); toast(`Сундук: +${fmt(g)} монет`); }
      else if (kind === "gems") { const n = 6 + Math.floor(Math.random() * 10); state.gems += n; toast(`Сундук: +${n} кристаллов`); }
      else if (kind === "turbo") { state.turbo = Math.max(Date.now(), state.turbo) + 180000; toast("Сундук: турбо ×3 на 3 минуты"); }
      else if (kind === "golden") { spawnGolden(); toast("Сундук: золотая монета"); }
      else if (kind === "skin") { const sk = skins[Math.floor(Math.random() * skins.length)]; state.owned.push(sk.id); toast(`Сундук: скин «${sk.name}»!`); }
      else if (kind === "pet") toast("Сундук: " + givePet(rollPet()));
      else { const i = avs[Math.floor(Math.random() * avs.length)]; state.avs.push(i); toast(`Сундук: аватарка ${AVATARS[i].e}`); }
      celebrate();
    }

    function pressCoin(x, y) {
      if (!ready) return;
      tickCombo();
      const crit = Math.random() < critChance();
      const gain = perClick() * (crit ? critMult() : 1);
      addCoins(gain);
      state.clicks += 1;
      state.quests.p.clicks += 1;
      renderStats();
      save();
      showPlus(x, y, gain, crit);
      burst(x, y, crit);
      if (crit) { ripple(x, y); bump(); }
      if (boss && boss.phase === "fight") { boss.hits += crit ? 2 : 1; if (boss.hits >= boss.need) winBoss(); else renderBoss(); }
      if (target) { const t = Date.now() - target.at; if (t >= hotFrom() && t <= HOT_TO) perfect(x, y); }
      coin.classList.add("pressed");
      haptic(crit ? "crit" : undefined);
    }

    // The coin leans towards the finger, like in other tap games.
    function release() {
      coin.classList.remove("pressed");
      coin.style.transform = "";
    }
    coin.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const r = coin.getBoundingClientRect();
      const dx = Math.max(-1, Math.min(1, (e.clientX - r.left - r.width / 2) / (r.width / 2)));
      const dy = Math.max(-1, Math.min(1, (e.clientY - r.top - r.height / 2) / (r.height / 2)));
      coin.style.transform = `perspective(520px) rotateX(${(-dy * 14).toFixed(1)}deg) rotateY(${(dx * 14).toFixed(1)}deg) scale(.95)`;
      pressCoin(e.clientX, e.clientY);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => coin.addEventListener(ev, release));

    // ---- profile (avatars), promo codes, changelog and the new-season notice: one sheet that the list never redraws ----
    const modalEl = document.getElementById("modal"), mbody = document.getElementById("mbody");
    let modalKind = "", promoMsg = null;
    const playerName = () => (tgUser && [tgUser.first_name, tgUser.username].find((x) => x)) || "Игрок";
    const avatarOpen = (i) => {
      const a = AVATARS[i];
      return a.kind === "free" || (a.kind === "lg" && leagueInfo().i >= a.n) || (a.kind === "rb" && state.rebirths >= a.n) || state.avs.includes(i);
    };
    const avatarFace = (a, cls, size) =>
      `<span class="av ${cls || ""}" style="${size ? `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.58)}px;` : ""}background:linear-gradient(135deg,${a.g[0]},${a.g[1]})">${a.e}</span>`;

    function profileView() {
      const L = leagueInfo().cur;
      const btn = (a, i) => {
        const open = avatarOpen(i);
        const label = open ? (state.avatar === i ? "Выбрано" : "") : a.kind === "gem" ? `${GEM}${a.n}` : a.kind === "lg" ? LEAGUES[a.n].n : `${a.n} пер.`;
        return `<button class="avbtn${state.avatar === i ? " sel" : ""}${open ? "" : " lock"}" data-av="${i}">${avatarFace(a, "", 42)}<span>${label || "&nbsp;"}</span></button>`;
      };
      return `<h3>Профиль</h3>
        <div class="prof">${avatarFace(AVATARS[state.avatar], "lg")}<div><b>${esc(playerName())}</b><span>${L.n} · перерождений: ${fmt(state.rebirths)}</span></div></div>
        <div class="sub" style="margin-top:14px">Выбери аватарку, её увидят другие игроки в топе. Часть открывается за лигу и перерождения, часть покупается за кристаллы.</div>
        <div class="avgrid">${AVATARS.map(btn).join("")}</div>`;
    }

    function promoView() {
      const msg = promoMsg ? `<div class="pmsg ${promoMsg[0]}">${promoMsg[1]}</div>` : '<div class="pmsg"></div>';
      return `<h3>Промокод</h3>
        <div class="sub">Введи код и получи награду. Каждый код можно активировать один раз. Активировано кодов: ${state.promos.length}.</div>
        <div class="pform"><input id="promo-in" type="text" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="КОД">
          <button type="button" data-m="apply">Принять</button></div>${msg}`;
    }

    const logView = () => `<h3>Что нового</h3>` + CHANGELOG.map((c) =>
      `<div class="clog"><h4><b>${c.v}</b>${c.t}</h4><ul>${c.items.map((t) => `<li>${t}</li>`).join("")}</ul></div>`).join("");

    const seasonView = () => `<h3>Начался сезон ${SEASON}</h3>
      <div class="sub">Все игроки начали заново, а топ очищен. Прогресс прошлого сезона не переносится, настройки сохранены.</div>
      <div class="clog"><ul>${(CHANGELOG.find((c) => c.season) || CHANGELOG[0]).items.slice(0, 8).map((t) => `<li>${t}</li>`).join("")}</ul></div>
      <button class="mok" type="button" data-m="close">Играть</button>`;

    function petsView() {
      const have = Object.keys(state.pets).length;
      const card = (p) => {
        const lv = state.pets[p.id] || 0, R = PET_RARITY[p.r];
        const dots = Array.from({ length: PET_MAX }, (_, i) => `<i${i < lv ? ' class="on"' : ""}></i>`).join("");
        return `<div class="petcard${lv ? "" : " lock"}" style="--rar:${R.c}"><span class="pe">${lv ? p.e : "❔"}</span><b>${lv ? p.name : "???"}</b>
          <span class="pr">${R.n}</span><span class="pl">${dots}</span><span class="pd">${lv ? `+${Math.round(p.v * lv * 1000) / 10}% ${p.text}` : "Найди в сундуке, яйце или у босса"}</span></div>`;
      };
      const totals = ["income", "click", "crit", "golden", "offline", "discount", "gems"].filter((k) => pet(k) > 0).map((k) => {
        const n = { income: "доход/с", click: "клики", crit: "крит", golden: "золото", offline: "офлайн", discount: "скидка", gems: "кристаллы" }[k];
        return `<span class="pill keep">${n} +${Math.round(pet(k) * 1000) / 10}%</span>`;
      }).join("");
      return `<h3>Питомцы · ${have} из ${PETS.length}</h3>
        <div class="sub">Питомцы выпадают из кристального сундука, яйца за кристаллы и после боссов. Повтор повышает уровень (до ${PET_MAX}), бонусы работают всегда.</div>
        <div class="keep-row">${totals || "Пока без бонусов"}</div><div class="petgrid">${PETS.map(card).join("")}</div>`;
    }

    function talentsView() {
      const row = (t) => {
        const lv = state.talents[t.id] || 0, max = lv >= TALENT_MAX, cost = TALENT_COST[lv] || 0;
        const dots = Array.from({ length: TALENT_MAX }, (_, i) => `<i${i < lv ? ' class="on"' : ""}></i>`).join("");
        const eff = t.v >= 1 ? `+${lv * t.v}` : `+${Math.round(t.v * lv * 1000) / 10}%`;
        return `<div class="talrow"><span class="te">${t.e}</span><div class="ti"><b>${t.name}</b><span>${lv ? `${eff} ${t.text}` : t.text}</span><span class="pl">${dots}</span></div>
          <button type="button" data-tal="${t.id}"${max || cost > talentPoints() ? " disabled" : ""}>${max ? "Макс" : `${cost} оч.`}</button></div>`;
      };
      return `<h3>Таланты · очков: ${talentPoints()}</h3>
        <div class="sub">За каждое перерождение даётся одно очко. Таланты остаются навсегда. Уровни стоят 1, 1, 2, 2 и 3 очка. Всего очков получено: ${state.rebirths}, потрачено: ${talentSpent()}.</div>
        <div class="talgrid">${TALENTS.map(row).join("")}</div>
        <button class="mok" type="button" data-m="respec"${talentSpent() ? "" : " disabled"}>Сбросить таланты за 3 ${GEM}</button>`;
    }
    function buyTalent(id) {
      const t = TALENTS.find((x) => x.id === id), lv = t && (state.talents[id] || 0);
      if (!t || lv >= TALENT_MAX || TALENT_COST[lv] > talentPoints()) return;
      state.talents[id] = lv + 1;
      haptic("success");
      renderStats();
      renderModal();
      flush();
    }
    function respecTalents() {
      if (!talentSpent() || state.gems < 3) { if (talentSpent()) toast("Нужно 3 кристалла"); return; }
      state.gems -= 3;
      state.talents = {};
      toast("Таланты сброшены: очки вернулись");
      renderStats();
      renderModal();
      flush();
    }

    function renderModal() {
      const views = { profile: profileView, promo: promoView, log: logView, season: seasonView, pets: petsView, talents: talentsView };
      if (views[modalKind]) mbody.innerHTML = views[modalKind]();
    }
    function openModal(kind) {
      modalKind = kind;
      promoMsg = null;
      if (kind === "log" || kind === "season") { state.seenVer = VERSION; save(); }
      renderModal();
      modalEl.hidden = false;
    }
    function closeModal() {
      modalEl.hidden = true;
      modalKind = "";
      if (tab === "rewards") keepScroll(() => renderList(true));
      renderStats();
    }

    function pickAvatar(i) {
      const a = AVATARS[i];
      if (!a) return;
      if (!avatarOpen(i)) {
        if (a.kind !== "gem") { toast(a.kind === "lg" ? `Нужна лига «${LEAGUES[a.n].n}»` : `Нужно перерождений: ${a.n}`); return; }
        if (state.gems < a.n) { toast(`Нужно кристаллов: ${a.n}`); return; }
        state.gems -= a.n;
        state.avs.push(i);
      }
      state.avatar = i;
      lastSentTotal = -1; // the next score upload carries the new avatar
      haptic("success");
      flush();
      renderStats();
      renderModal();
    }

    function applyPromo(raw) {
      const code = String(raw).trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
      const p = PROMOS[code];
      if (!code) promoMsg = ["bad", "Введи промокод"];
      else if (!p) promoMsg = ["bad", "Такого промокода нет"];
      else if (state.promos.includes(code)) promoMsg = ["bad", "Этот промокод уже активирован"];
      else {
        if (p.gems) state.gems += p.gems;
        if (p.coins) addCoins(wheelCoins(p.coins));
        if (p.turbo) state.turbo = Math.max(Date.now(), state.turbo) + p.turbo;
        if (p.skin && !state.owned.includes(p.skin)) state.owned.push(p.skin);
        if (p.pet) givePet(rollPet());
        if (p.avatar != null && !state.avs.includes(p.avatar)) state.avs.push(p.avatar);
        state.promos.push(code);
        promoMsg = ["ok", `Готово! Получено: ${p.text}`];
        haptic("success");
        celebrate();
        renderStats();
        flush();
      }
      renderModal();
    }

    modalEl.addEventListener("click", (e) => {
      if (e.target === modalEl || e.target.closest("#mclose") || e.target.closest('[data-m="close"]')) { closeModal(); return; }
      const av = e.target.closest("[data-av]");
      if (av) { pickAvatar(Number(av.dataset.av)); return; }
      const tl = e.target.closest("[data-tal]");
      if (tl) { buyTalent(tl.dataset.tal); return; }
      if (e.target.closest('[data-m="respec"]')) { respecTalents(); return; }
      if (e.target.closest('[data-m="apply"]')) applyPromo(document.getElementById("promo-in").value);
    });
    modalEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && e.target.id === "promo-in") applyPromo(e.target.value);
    });

    const visibleTabs = () => [...tabs].filter((t) => t.offsetParent !== null);

    // Space clicks the coin, digits open sections. preventDefault stops page scroll and keeps Space
    // from also "pressing" whichever shop button happens to have focus.
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !modalEl.hidden) { closeModal(); return; }
      if (!modalEl.hidden || (e.target.closest && e.target.closest("input, textarea"))) return;
      if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key >= "1" && e.key <= "9") {
        const t = visibleTabs()[e.key - 1];
        if (t) setTab(t.dataset.tab);
        return;
      }
      const sk = { KeyQ: "surge", KeyW: "meteor", KeyE: "haste" }[e.code];
      if (sk && !e.ctrlKey && !e.metaKey && !e.altKey) { useSkill(sk); return; }
      if (e.code !== "Space") return;
      e.preventDefault();
      if (e.repeat || !coin.offsetParent) return;
      const r = coin.getBoundingClientRect();
      pressCoin(r.left + r.width / 2 + (Math.random() - 0.5) * r.width * 0.5, r.top + r.height * 0.3);
    });
    document.addEventListener("keyup", (e) => {
      if (e.code !== "Space" || !modalEl.hidden) return;
      e.preventDefault();
      release();
    });

    listEl.addEventListener("pointerdown", () => { pressing = true; });
    ["pointerup", "pointercancel"].forEach((ev) => document.addEventListener(ev, () => { pressing = false; }));
    window.addEventListener("blur", () => { pressing = false; });

    listEl.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-act]");
      if (!btn || btn.disabled) return;
      const [kind, id] = btn.dataset.act.split(":");
      if (kind === "up") buyUpgrade(id);
      else if (kind === "perm") buyPerm(id);
      else if (kind === "rebirth") rebirth();
      else if (kind === "world") useWorld(id);
      else if (kind === "ach") claimAch(id);
      else if (kind === "daily") claimDaily();
      else if (kind === "quest") claimQuest(id);
      else if (kind === "chest") claimChest();
      else if (kind === "exp") startExp(Number(id));
      else if (kind === "expclaim") claimExp();
      else if (kind === "topsort") { topState.sort = id; loadTop(); }
      else if (kind === "toprefresh") loadTop();
      else if (kind === "boost") buyBoost(id);
      else if (kind === "spin") spin();
      else if (kind === "set") toggleSetting(id);
      else if (kind === "share") share();
      else if (kind === "modal") openModal(id);
      else if (kind === "reset") resetGame();
      else useSkin(id);
    });

    function setTab(name) {
      if (name === "home" && wide.matches) name = "upgrades"; // the sidebar always shows a section
      tab = name;
      listEl.scrollTop = 0;
      mainEl.classList.toggle("open", name !== "home");
      tabs.forEach((x) => x.classList.toggle("active", x.dataset.tab === name));
      renderList(true);
      enterAnim();
      checkRebirthNote();
      if (name === "top" && (topState.status !== "ok" || Date.now() - topLoadedAt > 30000)) loadTop(); // the list refreshes when you come back after 30 s
    }
    tabs.forEach((t) => t.addEventListener("click", () => setTab(t.dataset.tab)));
    document.getElementById("world-pill").addEventListener("click", () => setTab("worlds"));
    const openTop = () => setTab("top");
    leagueEl.addEventListener("click", openTop);
    leagueEl.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); openTop(); } });
    wide.addEventListener("change", () => setTab(tab));

    setInterval(() => {
      if (!ready) return;
      today = dayKey();
      ensureQuests();
      const gain = perSec();
      if (gain) { addCoins(gain); save(); }
      if (Date.now() < state.haste) {
        addCoins(perClick() * 10); save();
        if (boss && boss.phase === "fight") { boss.hits += 10; if (boss.hits >= boss.need) winBoss(); } // Haste's autoclicks hit the boss too
      }
      if (autoBuy() && tab === "upgrades" && !pressing) keepScroll(renderList);
      if (!goldenEl && !document.hidden && Date.now() >= nextGolden) {
        spawnGolden();
        nextGolden = Date.now() + goldenGap();
      }
      if (!document.hidden) submitScore(false);
      const nowT = Date.now();
      if (!boss && nowT >= nextBoss && !document.hidden && state.total >= 3000 && modalEl.hidden) {
        boss = { phase: "wait", until: nowT + BOSS_WAIT };
        toast("Появился босс! Нажми на красную плашку");
        haptic("gold");
      }
      if (!target && !boss && nowT >= nextTarget && coin.offsetParent && nowT - comboAt < 4000) { spawnTarget(); nextTarget = nowT + 10000 + Math.random() * 10000; }
      renderBoss();
      if (saveBlocked && Date.now() >= retryAt) { // the cloud did not answer at start: keep asking, then pick the real save up
        retryAt = Date.now() + 15000;
        readSave().then((raw) => {
          if (saveBlocked || !raw) return;
          state = parseState(raw);
          applySkin(); applyWorld(); renderStats(); renderList(true);
          toast("Сохранение найдено, прогресс загружен");
        });
      }
      renderStats();
    }, 1000);

    document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });
    window.addEventListener("pagehide", flush);

    // Telegram's WebView likes to keep an old copy of the page. On start we ask the server (bypassing every cache) which
    // version is current and, if ours is older, reopen the page under a fresh address. Tried once per version.
    function selfUpdate() {
      if (!/^https?:$/.test(location.protocol)) return;
      fetch(location.pathname + "?nocache=" + Date.now(), { cache: "no-store" }).then((r) => (r.ok ? r.text() : "")).then((t) => {
        const m = t.match(/VERSION = "([\d.]+)"/);
        if (!m || m[1] === VERSION || !ready) return;
        try { if (sessionStorage.getItem("upd") === m[1]) return; sessionStorage.setItem("upd", m[1]); } catch { return; }
        flush();
        toast("Вышло обновление, перезапускаю игру");
        setTimeout(() => location.replace(location.pathname + "?v=" + m[1] + "&t=" + Date.now()), 900);
      }).catch(() => {});
    }
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    }

    applySkin();
    applyWorld();
    renderStats();
    setTab(wide.matches ? "upgrades" : "home");
    load().then((s) => {
      state = s;
      ready = true;
      today = dayKey();
      ensureQuests();
      shownLeague = -1;
      const away = Math.min((Date.now() - state.lastSeen) / 1000, offlineCap());
      if (state.lastSeen && away >= 60 && perSec() > 0) {
        const gone = Math.floor(perSec() * away * offlineRate());
        addCoins(gone);
        toast(`Пока тебя не было: +${fmt(gone)} монет`);
        flush();
      }
      applySkin();
      if (state.world !== "meadow") applyWorld();
      renderStats();
      renderList();
      submitScore(false);
      if (saveBlocked) toast("Не удалось загрузить сохранение. Прогресс цел, игра попробует ещё раз");
      selfUpdate();
      if (seasonReset) openModal("season");
      else if (state.seenVer !== VERSION) {
        if (state.clicks > 0) openModal("log");
        else state.seenVer = VERSION;
      }
      if (state.clicks === 0) hint("tap", "Нажимай на монету: каждый клик приносит монеты");
    });
  </script>
</body>
</html>
