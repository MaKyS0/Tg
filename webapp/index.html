<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Coin Clicker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #17212b);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #8a9aa9);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none; overflow: hidden;
    }
    main {
      height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 32px; padding: 16px;
    }
    .label { color: var(--hint); font-size: 16px; text-transform: uppercase; letter-spacing: .1em; }
    #score { font-size: 56px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 4px; }
    .score-box { text-align: center; }
    #coin {
      position: relative;
      width: min(70vw, 280px); aspect-ratio: 1; border: none; border-radius: 50%; padding: 0;
      cursor: pointer; touch-action: manipulation;
      background: radial-gradient(circle at 35% 30%, #fff6a8 0%, #ffd23f 30%, #f0a500 70%, #b8740a 100%);
      box-shadow: 0 0 0 10px #d99000 inset, 0 0 0 14px #ffdf6b inset, 0 12px 40px rgba(255, 190, 0, .35);
      transition: transform .08s ease-out;
      font-size: min(32vw, 128px); font-weight: 900; color: #b06a00;
      text-shadow: 0 2px 0 #ffe98a;
    }
    #coin.pressed { transform: scale(.92); }
    .plus {
      position: fixed; pointer-events: none;
      font-size: 28px; font-weight: 800; color: #ffd23f;
      text-shadow: 0 2px 4px rgba(0,0,0,.4);
      animation: float .8s ease-out forwards;
    }
    @keyframes float {
      from { opacity: 1; transform: translate(-50%, -50%); }
      to   { opacity: 0; transform: translate(-50%, -150px); }
    }
  </style>
</head>
<body>
  <main>
    <div class="score-box">
      <div class="label">Монеты</div>
      <div id="score">0</div>
    </div>
    <button id="coin" aria-label="Кликнуть по монетке">$</button>
  </main>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    const STORAGE_KEY = "score";
    const scoreEl = document.getElementById("score");
    const coin = document.getElementById("coin");
    let score = 0;
    let saveTimer = null;

    // Telegram CloudStorage keeps the score per user across devices;
    // localStorage is the fallback when opened outside Telegram.
    const cloud = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")
      ? tg.CloudStorage : null;

    function render() {
      scoreEl.textContent = score.toLocaleString("ru-RU");
    }

    function load() {
      return new Promise((resolve) => {
        if (cloud) {
          cloud.getItem(STORAGE_KEY, (err, value) => resolve(err ? 0 : Number(value) || 0));
        } else {
          try { resolve(Number(localStorage.getItem(STORAGE_KEY)) || 0); } catch { resolve(0); }
        }
      });
    }

    function save() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        if (cloud) cloud.setItem(STORAGE_KEY, String(score));
        else try { localStorage.setItem(STORAGE_KEY, String(score)); } catch {}
      }, 300);
    }

    function showPlus(x, y) {
      const el = document.createElement("div");
      el.className = "plus";
      el.textContent = "+1";
      el.style.left = x + "px";
      el.style.top = y + "px";
      document.body.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }

    coin.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      score += 1;
      render();
      save();
      showPlus(e.clientX, e.clientY);
      coin.classList.add("pressed");
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach((ev) =>
      coin.addEventListener(ev, () => coin.classList.remove("pressed")));

    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    }
    load().then((v) => { score = v; render(); });
  </script>
</body>
</html>
